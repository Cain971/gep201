<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>GEP201 · Evaluación (prototipo)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f3efe6; --bg2:#ece6d8; --surface:#ffffff; --surface2:#faf7f0;
  --border:#e4dfcf; --border-strong:#cfc8b3;
  --ink:#211e17; --ink-mid:#5f584a; --ink-dim:#928975;
  --accent:#a0491d; --accent-soft:#f4e5d6; --on-accent:#fff;
  --ok:#2f6b3f; --ok-soft:#e0f0e2; --warn:#b45309; --warn-soft:#fbe9d2;
  --danger:#b3261e; --danger-soft:#fbe1df;
  --g1:#2f5d86; --g1-soft:#e7eef6; --g2:#2f7048; --g2-soft:#e6f1e9; --g3:#7a3d6e; --g3-soft:#f3e9f1;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --tap:48px;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --font-name:'Playfair Display',Georgia,serif;
  --shadow:0 1px 2px rgba(40,32,16,.05), 0 8px 24px -14px rgba(40,32,16,.22);
}

html{height:100%}
body{
  height:100dvh; min-height:100dvh;
  background:var(--bg); color:var(--ink);
  font-family:var(--font-mono); font-size:16px; line-height:1.5;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-text-size-adjust:100%;
}
button,input,textarea{font-family:inherit; font-size:inherit; color:inherit}
button{-webkit-tap-highlight-color:transparent}

/* ══════════ HEADER ══════════ */
header{
  flex-shrink:0; background:var(--ink); color:#f3efe6;
  padding:max(10px,env(safe-area-inset-top)) 14px 10px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  border-bottom:2px solid var(--accent); z-index:20;
}
.hdr-brand{font-family:var(--font-name); font-weight:700; font-size:17px; white-space:nowrap}
.hdr-brand span{color:#e0a06f}
.hdr-ctx{display:flex; gap:7px; margin-left:auto; align-items:center; flex-wrap:wrap}
.ctx-chip{
  display:flex; align-items:center; gap:6px; background:#302b22; border:1px solid #453f33;
  border-radius:var(--r-sm); padding:0 4px 0 9px; height:34px;
  font-size:12px; color:#cdc4b4; letter-spacing:.02em;
}
.ctx-chip label{color:#8c8474; font-size:10px; letter-spacing:.12em; text-transform:uppercase}
.ctx-chip input{
  background:transparent; border:none; outline:none; color:#f3efe6; font-weight:500;
  height:32px; padding:0 4px; min-width:0;
}
.ctx-chip input#inp-sesion{width:88px}
.ctx-chip input#inp-fecha{width:132px; color-scheme:dark}
.sync-dot{
  font-size:11px; padding:4px 9px; border-radius:20px; background:#302b22; color:#8c8474;
  white-space:nowrap; transition:all .3s; letter-spacing:.03em;
}
.sync-dot.ok{color:#7bbf8e; background:#12331d} .sync-dot.syncing{color:#e0a06f; background:#3a2a10}
.sync-dot.error{color:#e88; background:#3a1210}
@media(max-width:560px){
  header{padding-left:12px; padding-right:12px; gap:8px}
  .hdr-brand{font-size:15px}
  .hdr-ctx{gap:6px; width:100%; margin-left:0}
  .ctx-chip{flex:1; min-width:0}
  .ctx-chip label{display:none}
  .ctx-chip input#inp-sesion{width:100%}
  .ctx-chip input#inp-fecha{width:100%}
  .sync-dot{position:absolute; top:max(10px,env(safe-area-inset-top)); right:12px; font-size:0; padding:0; width:12px; height:12px; border-radius:50%; background:transparent}
  .sync-dot::before{content:'●'; font-size:13px}
}

/* ══════════ MODE BAR ══════════ */
.modebar{
  flex-shrink:0; display:flex; background:var(--surface2); border-bottom:1px solid var(--border);
  z-index:15;
}
.mode-tab{
  flex:1; min-height:46px; background:none; border:none; cursor:pointer;
  font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim);
  border-bottom:2.5px solid transparent; padding:6px 4px; transition:color .15s,border-color .15s;
}
.mode-tab .mt-n{font-family:var(--font-name); font-size:15px; display:block; color:var(--ink-dim)}
.mode-tab.active{color:var(--accent); border-bottom-color:var(--accent)}
.mode-tab.active .mt-n{color:var(--accent)}

/* ══════════ SORTEO QUEUE ══════════ */
#sorteo-queue{flex-shrink:0; background:var(--accent-soft); border-bottom:1px solid var(--border-strong); display:none}
#sorteo-queue.show{display:block}
.q-inner{max-width:760px; margin:0 auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px}
.q-title{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:600}
.q-item{
  display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border-strong);
  border-radius:var(--r-md); padding:8px 8px 8px 12px;
}
.q-item .q-name{font-family:var(--font-name); font-weight:700; font-size:16px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.q-item .q-meta{font-size:11px; color:var(--ink-dim); white-space:nowrap}
.q-item .q-go{
  min-height:40px; padding:0 16px; background:var(--accent); color:var(--on-accent); border:none;
  border-radius:var(--r-sm); font-size:12px; font-weight:600; letter-spacing:.04em; cursor:pointer; white-space:nowrap;
}
.q-item .q-x{
  min-width:40px; min-height:40px; background:transparent; border:1px solid var(--border-strong);
  border-radius:var(--r-sm); color:var(--ink-dim); cursor:pointer; font-size:15px;
}

/* ══════════ APP (scroll area) ══════════ */
#app{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
.wrap{max-width:760px; margin:0 auto; padding:16px 14px 28px}
@media(min-width:1000px){ .wrap{max-width:860px} }

.crumb-row{display:flex; align-items:center; gap:10px; margin-bottom:14px; min-height:36px}
.crumb-back{
  display:inline-flex; align-items:center; gap:6px; min-height:38px; padding:0 12px 0 8px;
  background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-sm);
  font-size:12px; letter-spacing:.04em; color:var(--ink-mid); cursor:pointer; white-space:nowrap;
}
.crumb-back:hover{border-color:var(--accent); color:var(--accent)}
.crumb-label{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim)}

.screen-title{font-family:var(--font-name); font-weight:700; font-size:clamp(21px,5vw,27px); line-height:1.15; margin-bottom:6px}
.screen-sub{font-size:13px; color:var(--ink-mid); margin-bottom:18px}

/* ── student picker ── */
.grp-block{margin-bottom:14px}
.grp-head{
  font-size:11px; letter-spacing:.18em; text-transform:uppercase; padding:4px 2px 8px;
  display:flex; align-items:center; gap:7px;
}
.grp-head::before{content:''; width:8px; height:8px; border-radius:50%}
.grp-1 .grp-head{color:var(--g1)} .grp-1 .grp-head::before{background:var(--g1)}
.grp-2 .grp-head{color:var(--g2)} .grp-2 .grp-head::before{background:var(--g2)}
.grp-3 .grp-head{color:var(--g3)} .grp-3 .grp-head::before{background:var(--g3)}
.stu-row{
  display:flex; align-items:center; gap:12px; width:100%; min-height:var(--tap);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:9px 12px; margin-bottom:7px; cursor:pointer; text-align:left; transition:border-color .12s, background .12s;
}
.stu-row:hover{border-color:var(--border-strong)}
.stu-row:active{background:var(--surface2)}
.stu-row.graded{opacity:.6}
.stu-ind{
  width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; color:var(--ink-dim);
}
.stu-row.graded .stu-ind{background:var(--ok); border-color:var(--ok); color:#fff}
.stu-name{flex:1; min-width:0}
.stu-name b{font-family:var(--font-name); font-weight:700; font-size:16px; display:block; color:var(--ink)}
.stu-name small{font-size:11px; color:var(--ink-dim); display:block; margin-top:1px}
.stu-count{
  font-size:12px; padding:3px 9px; border-radius:20px; flex-shrink:0; letter-spacing:.02em;
}
.stu-count.low{background:var(--warn-soft); color:var(--warn)}
.stu-count.ok{background:var(--ok-soft); color:var(--ok)}

/* ── active student header ── */
.active-card{
  background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-lg);
  padding:16px 16px 14px; margin-bottom:16px; box-shadow:var(--shadow);
}
.active-card .ac-name{font-family:var(--font-name); font-weight:700; font-size:clamp(22px,6vw,30px); line-height:1.1}
.active-card .ac-meta{font-size:12px; color:var(--ink-dim); margin-top:4px; letter-spacing:.04em}
.active-card .ac-badge{
  display:inline-block; margin-top:8px; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  background:var(--accent-soft); color:var(--accent); padding:3px 9px; border-radius:6px;
}

/* ── section wrapper ── */
.sec{margin-bottom:16px}
.sec-label{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:9px; font-weight:600}

/* ── big choice buttons (participación) ── */
.choice-grid{display:flex; flex-direction:column; gap:9px}
@media(min-width:560px){ .choice-grid.c3{flex-direction:row} .choice-grid.c3 .choice{flex:1} }
.choice{
  display:flex; align-items:center; gap:13px; width:100%; min-height:64px;
  background:var(--surface); border:2px solid var(--border); border-radius:var(--r-md);
  padding:12px 15px; cursor:pointer; text-align:left; transition:all .12s;
}
.choice:active{transform:scale(.985)}
.choice .ch-ic{font-size:22px; width:26px; text-align:center; flex-shrink:0}
.choice .ch-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.choice .ch-name{font-family:var(--font-name); font-weight:700; font-size:17px; line-height:1.2}
.choice .ch-desc{font-size:12px; color:var(--ink-dim); line-height:1.35}
.choice .ch-val{font-size:15px; font-weight:600; flex-shrink:0; color:var(--ink-dim)}
.choice.sel-bonus{border-color:var(--ok); background:var(--ok-soft)}
.choice.sel-bonus .ch-val{color:var(--ok)}
.choice.sel-neutral{border-color:var(--border-strong); background:var(--surface2)}
.choice.sel-penalty{border-color:var(--warn); background:var(--warn-soft)}
.choice.sel-penalty .ch-val{color:var(--warn)}
.choice.sel-full{border-color:var(--ok); background:var(--ok-soft)}
.choice.sel-full .ch-val{color:var(--ok)}
.choice.sel-partial{border-color:#d98a2b; background:#fbefdb}
.choice.sel-poor{border-color:var(--warn); background:var(--warn-soft)}
.choice.sel-poor .ch-val{color:var(--warn)}
.choice.sel-none{border-color:var(--danger); background:var(--danger-soft)}
.choice.sel-none .ch-val{color:var(--danger)}

/* ── instrument segmented ── */
.seg{display:flex; gap:8px}
.seg button{
  flex:1; min-height:var(--tap); background:var(--surface); border:2px solid var(--border);
  border-radius:var(--r-md); font-family:var(--font-name); font-weight:700; font-size:18px;
  color:var(--ink-mid); cursor:pointer; transition:all .12s;
}
.seg button.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}

/* ── bonus toggle ── */
.bonus-toggle{
  display:flex; align-items:center; gap:11px; min-height:var(--tap); padding:0 14px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); cursor:pointer;
}
.bonus-toggle .bt-box{
  width:24px; height:24px; border-radius:6px; border:2px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; color:#fff;
}
.bonus-toggle.on .bt-box{background:var(--ok); border-color:var(--ok)}
.bonus-toggle .bt-label{font-size:14px}

/* ── question bank (reference) ── */
.qbank details{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  margin-bottom:7px; overflow:hidden;
}
.qbank summary{
  list-style:none; cursor:pointer; padding:11px 13px; display:flex; align-items:center; gap:9px;
  min-height:var(--tap); font-family:var(--font-name); font-weight:700; font-size:15px;
}
.qbank summary::-webkit-details-marker{display:none}
.qbank summary .q-num{
  width:20px; height:20px; border-radius:50%; font-family:var(--font-mono); font-size:11px; font-weight:600;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.qbank .dd .q-num{background:var(--g1-soft); color:var(--g1)} .qbank .dj .q-num{background:var(--g2-soft); color:var(--g2)}
.qbank .dm .q-num{background:var(--accent-soft); color:var(--accent)} .qbank .dt .q-num{background:var(--g3-soft); color:var(--g3)}
.qbank summary .q-used{margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); background:var(--bg2); padding:2px 7px; border-radius:10px; font-weight:400}
.qbank summary .q-arrow{color:var(--ink-dim); font-size:11px; transition:transform .2s}
.qbank details[open] summary .q-arrow{transform:rotate(90deg)}
.q-body{padding:2px 13px 11px; border-top:1px solid var(--border)}
.q-lvl{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim); padding:9px 0 4px}
.q-pick{
  display:flex; gap:9px; padding:9px 4px; cursor:pointer; border-radius:var(--r-sm); align-items:flex-start;
}
.q-pick:active{background:var(--surface2)}
.q-pick .q-chk{
  width:19px; height:19px; border:1.5px solid var(--border-strong); border-radius:5px; flex-shrink:0;
  margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
}
.q-pick.used .q-chk{background:var(--ink-mid); border-color:var(--ink-mid)}
.q-pick.used .q-txt{text-decoration:line-through; color:var(--ink-dim)}
.q-txt{font-size:14px; line-height:1.45; flex:1}

/* ── note ── */
.note-area{
  width:100%; min-height:60px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); padding:11px 13px; font-size:15px; line-height:1.5; resize:vertical; outline:none;
}
.note-area:focus{border-color:var(--accent)}

/* ── ajuste / nota readout ── */
.readout{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--ink); color:#f3efe6; border-radius:var(--r-md); padding:13px 16px; margin-bottom:16px;
}
.readout .ro-label{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#8c8474}
.readout .ro-calc{font-size:12px; color:#b8ae9c; margin-top:3px}
.readout .ro-value{font-family:var(--font-name); font-weight:700; font-size:30px; line-height:1; color:#e0a06f}

/* ── rubric (TF) ── */
.rub-crit{margin-bottom:14px}
.rub-crit-hd{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px}
.rub-crit-hd b{font-family:var(--font-mono); font-weight:600; font-size:13px}
.rub-crit-hd span{font-size:11px; color:var(--ink-dim)}
.rub-scale{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.rub-btn{
  min-height:62px; background:var(--surface); border:2px solid var(--border); border-radius:var(--r-sm);
  cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:6px 3px;
}
.rub-btn .rb-n{font-family:var(--font-name); font-weight:700; font-size:19px; color:var(--ink-dim)}
.rub-btn .rb-l{font-size:9.5px; line-height:1.1; text-align:center; color:var(--ink-dim)}
.rub-btn.sel{border-color:var(--accent); background:var(--accent-soft)}
.rub-btn.sel .rb-n, .rub-btn.sel .rb-l{color:var(--accent)}

/* ── M3 assign / confirm / review rows ── */
.m3-row{
  display:flex; align-items:center; gap:12px; width:100%; min-height:var(--tap);
  background:var(--surface); border:1.5px solid var(--border); border-radius:var(--r-md);
  padding:9px 13px; margin-bottom:7px; cursor:pointer; text-align:left;
}
.m3-row.assigned{border-color:var(--accent); background:var(--accent-soft)}
.m3-row .m3-badge{
  min-width:34px; height:26px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:12px; font-weight:600; flex-shrink:0; border:1px solid var(--border-strong); color:var(--ink-dim);
}
.m3-row .m3-badge.p{background:var(--g1-soft); color:var(--g1); border-color:var(--g1)}
.m3-row .m3-badge.r{background:var(--g3-soft); color:var(--g3); border-color:var(--g3)}
.m3-row .m3-nm{flex:1; font-family:var(--font-name); font-weight:700; font-size:16px}
.m3-row .m3-sec{font-size:11px; color:var(--ink-dim); text-align:right; max-width:130px; line-height:1.3}
.m3-row .m3-nota{font-family:var(--font-name); font-weight:700; font-size:20px; color:var(--accent); margin-left:auto}
.m3-row .m3-nota small{font-size:11px; color:var(--ink-dim); font-weight:400}

/* progress dots */
.m3-prog{display:flex; gap:5px; margin-bottom:14px}
.m3-prog i{flex:1; height:5px; border-radius:3px; background:var(--border)}
.m3-prog i.done{background:var(--ok)} .m3-prog i.now{background:var(--accent)}

.pill-info{
  font-size:12px; background:var(--accent-soft); color:var(--accent); border:1px solid var(--border-strong);
  border-radius:var(--r-sm); padding:9px 12px; margin-bottom:14px; line-height:1.4;
}

/* ── history ── */
.hist-toggle{
  width:100%; min-height:44px; background:none; border:none; border-top:1px solid var(--border);
  margin-top:8px; padding-top:12px; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
}
#hist-list{margin-top:6px}
.hist-item{display:flex; gap:11px; padding:9px 2px; border-bottom:1px solid var(--border)}
.hi-adj{font-family:var(--font-name); font-weight:700; font-size:17px; min-width:32px; text-align:center; flex-shrink:0}
.hi-adj.pos{color:var(--ok)} .hi-adj.neg{color:var(--danger)} .hi-adj.neu{color:var(--ink-dim)}
.hi-name{font-weight:500; font-size:14px}
.hi-meta{font-size:11px; color:var(--ink-dim); margin-top:1px}
.hi-obs{font-size:12px; color:var(--ink-mid); font-style:italic; margin-top:2px}

.empty{text-align:center; color:var(--ink-dim); font-size:13px; padding:34px 10px; line-height:1.6}
.loaderr{text-align:center; color:var(--danger); font-size:14px; padding:40px 16px; line-height:1.6}

/* ══════════ ACTION BAR (sticky bottom) ══════════ */
#action-bar{
  flex-shrink:0; background:var(--surface); border-top:1px solid var(--border-strong);
  padding:10px 14px max(12px,env(safe-area-inset-bottom));
  display:none; z-index:18; box-shadow:0 -6px 20px -14px rgba(40,32,16,.3);
}
#action-bar.show{display:block}
#action-bar .ab-inner{max-width:760px; margin:0 auto; display:flex; gap:9px; align-items:center}
.btn-primary{
  flex:1; min-height:52px; background:var(--accent); color:var(--on-accent); border:none;
  border-radius:var(--r-md); font-size:14px; font-weight:600; letter-spacing:.05em; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-primary:disabled{opacity:.4; cursor:not-allowed}
.btn-primary.wide{width:100%}
.btn-ghost{
  min-height:52px; padding:0 18px; background:var(--surface); color:var(--ink-mid);
  border:1px solid var(--border-strong); border-radius:var(--r-md); font-size:13px; cursor:pointer; white-space:nowrap;
}
.ab-hint{font-size:11px; color:var(--ink-dim); text-align:center; margin-top:6px; letter-spacing:.03em}

/* ══════════ TOAST ══════════ */
#toast{
  position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(70px);
  background:var(--ink); color:#f3efe6; font-size:13px; padding:11px 20px; border-radius:22px;
  border-left:3px solid var(--accent); z-index:99; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis;
  transition:transform .25s ease; opacity:0;
}
#toast.show{transform:translateX(-50%) translateY(0); opacity:1}
#toast.err{border-left-color:var(--danger)}

#app::-webkit-scrollbar{width:5px} #app::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:3px}

<body>

  <div class="hdr-ctx">

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   LÓGICA — copiada de index.html sin cambios funcionales.
   Solo cambia la CAPA DE PRESENTACIÓN (render*, markup, CSS).
   ═══════════════════════════════════════════════════════════════════════════ */
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzSur7nSfzlTjhTF286vnu34wrY5-U1sYkgztpGRk0i8o9Mh9yGNCrjgqH5_p9qqOwMWA/exec';

let STUDENTS=[];

const QUESTIONS={
  RP1:{

    justificacion:{title:'Justificación de la CI',cls:'dj',num:'2',levels:{
      1:['Relevancia y efectos según evidencia'],
      2:['Contradicciones entre fuentes y cómo las manejaron'],
      3:['CI alternativa descartada / fuente más difícil']}},
    magnitud:{title:'Magnitud de la CI',cls:'dm',num:'3',levels:{
      1:['Indicador, fuente y cálculo'],
      2:['Limitaciones del indicador'],
      3:['Comparabilidad territorial / datos descartados']}}
  },
  RP2:{
    arquitectura:{title:'Arquitectura causal',cls:'dd',num:'1',levels:{
      1:['Diferencia MC vs ME en su trabajo concreto','Lógica de niveles causales: por qué ese factor en ese nivel'],
      2:['Factores descartados y criterio de exclusión'],

    especificidad:{title:'Especificidad y población',cls:'dj',num:'2',levels:{
      1:['Presencia en el Perú: evidencia concreta'],
      2:['Quién tiene el problema, precisión de la población'],

    evidencia:{title:'Rigor de evidencia',cls:'dm',num:'3',levels:{
      1:['Tipo de estudio detrás de cada relación causal'],
      2:['Contradicciones en la evidencia y resolución'],
      3:['Poder explicativo relativo de los factores']}}
  },
  RP3:{
    indicadores:{title:'Indicadores y TdC',cls:'dd',num:'1',levels:{
      1:['Qué parte de la cadena causal mide cada indicador','Indicador de resultado vs. producto: distinción deliberada'],
      2:['Quién mide, con qué fuente, con qué frecuencia'],
      3:['Indicador mejora pero CI no cambia: cómo lo detectarían']}},
    implementacion:{title:'Implementación',cls:'dj',num:'2',levels:{
      1:['Cómo llega el producto al ciudadano: punto de atención concreto'],
      2:['Brechas de implementación y cómo las abordan'],
      3:['Actores clave, intereses y puntos de resistencia']}},
    viabilidad:{title:'Viabilidad',cls:'dm',num:'3',levels:{
      1:['Limitaciones de sus indicadores'],
      2:['Diferencias territoriales en la propuesta'],
      3:['Análisis de actores reflejado en modelo operativo']}}
  },
  TF:{
    diagnostico:{title:'Diagnóstico',cls:'dd',num:'1',levels:{
      1:['CI como argumento no como lista','Brechas por región o grupo poblacional'],
      2:['Datos actualizados y fuentes oficiales'],
      3:['Magnitud y tendencia justifican la intervención']}},
    modelos:{title:'Modelos MC / ME',cls:'dj',num:'2',levels:{
      1:['Cambios desde RP2 y justificación'],
      2:['Desconexión ME hacia TdC si la hay'],
      3:['Factores priorizados coherentes con la TdC']}},
    tdc:{title:'Teoría de Cambio',cls:'dm',num:'3',levels:{
      1:['Narrativa producto hacia resultado hacia impacto sin leer'],
      2:['Productos no seleccionados y por qué','Supuestos de la cadena en contexto peruano'],
      3:['Coherencia indicadores resultado vs. producto']}},
    transversal:{title:'Competencias transversales',cls:'dt',num:'4',levels:{
      1:['Resumen en dos oraciones: qué proponen y por qué el Estado debe financiarlo'],
      2:['Inconsistencia identificada en el propio trabajo'],
      3:['Limitación más importante reconocida explícitamente']}}
  }
};

const TF_SECTIONS=[
  'Sección 1 · Diagnóstico',
  'Sección 2 · Modelo Conceptual y Explicativo',
  'Sección 3 · Teoría de Cambio',
  'Sección 4 · Indicadores e Implementación',
];

const RUBRIC_CRITERIA=[
  {id:'c1',label:'C1 · Dominio y precisión',peso:0.50,levels:['Muy débil','En desarrollo','Competente','Excelente']},
  {id:'c2',label:'C2 · Claridad y coherencia',peso:0.30,levels:['Muy débil','En desarrollo','Competente','Excelente']},
  {id:'c3',label:'C3 · Comunicación oral',peso:0.20,levels:['Muy débil','En desarrollo','Competente','Excelente']},
];

const INSTRUMENTOS_RP=['RP1','RP2','RP3'];

const NIVELES=[
  {id:'full',icon:'✓✓',name:'Dominio completo',desc:'Preciso, cita fuentes, explica el proceso.',effect:'0 pts',delta:0,cls:'nv-full'},
  {id:'partial',icon:'✓',name:'Dominio parcial',desc:'Entiende pero con imprecisiones.',effect:'−1 pt',delta:-1,cls:'nv-partial'},
  {id:'poor',icon:'✗',name:'Dominio insuficiente',desc:'Escasa participación real.',effect:'−3 pts',delta:-3,cls:'nv-poor'},
  {id:'none',icon:'⛔',name:'Sin dominio',desc:'No responde o respuesta nula. La nota de este RP para este alumno queda fija en 10, sin importar la nota grupal.',effect:'Nota = 10',delta:0,cls:'nv-none'},
];

const ADJ_OPTS=[
  {id:'bonus',icon:'⭐',label:'Destaca',value:'+1',delta:1},
  {id:'neutral',icon:'○',label:'Cumple',value:'0',delta:0},
  {id:'penalty',icon:'▽',label:'No cumple',value:'−1',delta:-1},
];

let S={
  mode:1,activeStudent:null,activeStudentOrigen:null,selectedInstrumento:'Participacion',
  selectedNivel:null,selectedAdj:null,bonusActive:false,
  usedQuestions:new Set(),sessionHistory:[],graded:{},
  mobStep:0,
  m3step:0, m3group:null, m3order:[], m3evals:{}, m3current:0,
  m3rubric:{c1:null,c2:null,c3:null}, m3nivel:null,
  histOpen:false,
};

const isMob=()=>window.innerWidth<640;
const mkEl=(tag,cls)=>{const el=document.createElement(tag||'div');if(cls)el.className=cls;return el;};
// nombre/apellidos con corte limpio si el backend los manda separados
function nmParts(st){
  let g=st.nombres||'', f=st.apellidos||'';
  if(!g||!f){ const p=(st.name||'').split(' '); g=g||p[0]||''; f=f||p.slice(1).join(' '); }
  return {given:g,family:f,first:g.split(' ')[0],fam1:f.split(' ')[0]||g.split(' ')[1]||''};
}
const fn=(st)=>nmParts(st).first;
const ln=(st)=>{const n=nmParts(st);return (n.given.split(' ').slice(1).join(' ')+' '+n.family).trim()||n.family;};
const shortName=(st)=>{const n=nmParts(st);return (n.first+' '+n.fam1).trim();};

document.addEventListener('DOMContentLoaded',()=>{
  // Sesión y fecha: persistidas en el dispositivo (arreglo del bug: antes no se
  // podían editar en móvil y quedaba "Clase 3" fijo en el HTML).
  const sEl=document.getElementById('inp-sesion'), fEl=document.getElementById('inp-fecha');
  const today=new Date().toISOString().split('T')[0];
  let savedS='', savedF='';
  try{ savedS=localStorage.getItem('gep201_sesion')||''; savedF=localStorage.getItem('gep201_fecha')||''; }catch(e){}
  sEl.value=savedS;
  // fecha: mantener la guardada si es reciente (≤2 días), si no usar hoy
  fEl.value=(savedF && daysBetween(savedF,today)<=2) ? savedF : today;
  const persist=()=>{ try{ localStorage.setItem('gep201_sesion',sEl.value); localStorage.setItem('gep201_fecha',fEl.value); }catch(e){} };
  sEl.addEventListener('change',persist); sEl.addEventListener('blur',persist);
  fEl.addEventListener('change',persist);
  setMode(1);
  setInterval(consultarSorteo,4000);
  cargarNomina();
});
function daysBetween(a,b){ return Math.abs((new Date(b)-new Date(a))/86400000); }

// ── NÓMINA ──────────────────────────────────────────────────────────────────
async function cargarNomina(){
  try{
    const res=await fetch(SCRIPT_URL+'?action=nomina');
    const data=await res.json();
    if(data.status!=='ok') throw new Error(data.msg||'respuesta inválida');
    STUDENTS=data.alumnos.map(a=>({name:a.nombre,code:String(a.codigo),group:a.grupo,nombres:a.nombres||'',apellidos:a.apellidos||''}));
    render();
    cargarConteosParticipacion();
  }catch(e){
    console.error('No se pudo cargar la nómina',e);
    document.getElementById('wrap').innerHTML='<div class="loaderr">No se pudo cargar la lista de alumnos.<br>Revisa tu conexión e intenta recargar.</div>';
  }
}

const META_PARTICIPACION=2;
let PART_CONTEOS={};
async function cargarConteosParticipacion(){
  try{
    const res=await fetch(SCRIPT_URL+'?action=sorteo_conteos');
    const data=await res.json();
    if(data.status==='ok'){ PART_CONTEOS=data.conteos; render(); }
  }catch(e){}
}

// ── SORTEO ENTRANTE ─────────────────────────────────────────────────────────
let sorteosVistos=new Set();
let colaSorteos=[];
let sorteoBaseInicializada=false;

async function consultarSorteo(){
  try{
    const res=await fetch(SCRIPT_URL+'?action=sorteo_estado');
    const data=await res.json();
    if(data.status!=='ok') return;
    const sorteos=data.sorteos||[];
    if(!sorteoBaseInicializada){
      sorteos.forEach(s=>sorteosVistos.add(String(s.timestamp)));
      sorteoBaseInicializada=true;
      return;
    }
    let huboNuevos=false;
    sorteos.forEach(s=>{
      const key=String(s.timestamp);
      if(!sorteosVistos.has(key)){ sorteosVistos.add(key); if(s.codigo) colaSorteos.push(s); huboNuevos=true; }
    });
    if(huboNuevos) renderColaSorteos();
  }catch(e){}
}

function renderColaSorteos(){
  const box=document.getElementById('sorteo-queue');
  const inner=document.getElementById('q-inner');
  if(!colaSorteos.length){ box.classList.remove('show'); inner.innerHTML=''; return; }
  box.classList.add('show');
  inner.innerHTML='<div class="q-title">Del sorteo · '+colaSorteos.length+' pendiente'+(colaSorteos.length>1?'s':'')+'</div>'+
    colaSorteos.map(s=>{
      const st=STUDENTS.find(x=>x.code===String(s.codigo));
      const nom=st?shortName(st):s.alumno;
      return '<div class="q-item">'+
        '<span class="q-name">'+nom+'</span>'+
        '<span class="q-meta">'+(s.grupo||'')+'</span>'+
        '<button class="q-go" onclick="aceptarSorteo(\''+s.codigo+'\')">Calificar</button>'+
        '<button class="q-x" onclick="descartarSorteo(\''+s.codigo+'\')" aria-label="Descartar">✕</button>'+
      '</div>';
    }).join('');
}

function aceptarSorteo(codigo){
  const idx=colaSorteos.findIndex(s=>String(s.codigo)===String(codigo));
  if(idx===-1) return;
  const item=colaSorteos[idx];
  colaSorteos.splice(idx,1);
  const st=STUDENTS.find(s=>s.code===String(item.codigo));
  if(item.modoDestino==='Modo 1') setMode(1);
  else if(item.modoDestino==='Modo 2'){ setMode(2); S.mobStep=1; }
  if(st){ S.activeStudent=st; S.activeStudentOrigen='sorteo'; S.mobStep=2; }
  renderColaSorteos();
  render();
}
function descartarSorteo(codigo){
  const idx=colaSorteos.findIndex(s=>String(s.codigo)===String(codigo));
  if(idx!==-1) colaSorteos.splice(idx,1);
  renderColaSorteos();
}

// ── MODE SWITCH ─────────────────────────────────────────────────────────────
function setMode(m){
  S.mode=m; S.activeStudent=null; S.activeStudentOrigen=null; S.selectedNivel=null; S.selectedAdj=null;
  S.bonusActive=false; S.mobStep = (m===2) ? 0 : 1;
  S.m3step=0; S.m3group=null; S.m3order=[]; S.m3evals={}; S.m3current=0;
  S.m3rubric={c1:null,c2:null,c3:null}; S.m3nivel=null;
  if(m===1) S.selectedInstrumento='Participacion';
  else if(m===2) S.selectedInstrumento='RP1';
  else S.selectedInstrumento='TF';
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.toggle('active',parseInt(t.dataset.mode)===m));
  render();
}

// ── CALC (verbatim) ─────────────────────────────────────────────────────────
function calcAjuste(){
  if(S.mode===1){const adj=ADJ_OPTS.find(o=>o.id===S.selectedAdj);return adj?adj.delta:null;}
  const bonus=S.bonusActive?1:0;
  const nivel=NIVELES.find(n=>n.id===S.selectedNivel);
  if(!nivel) return bonus>0?bonus:null;
  return nivel.delta+bonus;
}
function updateAjuste(){
  const aj=calcAjuste();
  const valEl=document.getElementById('aj-value');
  const calcEl=document.getElementById('aj-calc');
  if(!valEl) return;
  if(aj===null){valEl.textContent='—';if(calcEl)calcEl.textContent='—';}
  else{
    valEl.textContent=(aj>=0?'+':'')+aj;
    if(calcEl){
      if(S.mode===1){const opt=ADJ_OPTS.find(o=>o.id===S.selectedAdj);calcEl.textContent=opt?opt.label:'—';}
      else{const parts=[];const n=NIVELES.find(n=>n.id===S.selectedNivel);if(n&&n.delta!==0)parts.push('nivel: '+n.delta);if(S.bonusActive)parts.push('+1 bonus');calcEl.textContent=parts.length?parts.join(', '):'sin cambio';}
    }
  }
  refreshActionBar();
}
function updateNotaTF(){
  const valEl=document.getElementById('nota-tf-value');
  const calcEl=document.getElementById('nota-tf-calc');
  if(valEl){
    const c1=S.m3rubric.c1,c2=S.m3rubric.c2,c3=S.m3rubric.c3;
    if(!c1||!c2||!c3){valEl.textContent='—';if(calcEl)calcEl.textContent='Completa los 3 criterios';}
    else{
      const raw=(c1*0.5+c2*0.3+c3*0.2)*5;
      const nota=raw%1>=0.5?Math.ceil(raw):Math.floor(raw);
      valEl.textContent=nota;
      if(calcEl)calcEl.textContent='('+c1+'×50% + '+c2+'×30% + '+c3+'×20%) × 5 = '+nota;
    }
  }
  refreshActionBar();
}

// ── REGISTER Modo 1 & 2 (verbatim salvo el retorno a la lista) ───────────────
async function registrar(){
  if(!S.activeStudent){toast('Selecciona un alumno primero',true);return;}
  if(!S.selectedInstrumento){toast('Selecciona el instrumento',true);return;}
  if(S.mode===1&&S.selectedAdj===null){toast('Elige la calificación de la intervención',true);return;}
  if(S.mode===2&&!S.selectedNivel&&!S.bonusActive){toast('Elige el nivel de desempeño',true);return;}
  const aj=calcAjuste(); if(aj===null){toast('Selecciona una opción',true);return;}
  const ajStr=String(aj);
  const nivel=NIVELES.find(n=>n.id===S.selectedNivel);
  const adjOpt=ADJ_OPTS.find(o=>o.id===S.selectedAdj);
  const obsEl=document.getElementById('inp-obs');
  const rol=S.mode===1?('participacion-'+(S.activeStudentOrigen||'manual')):'dinamica';
  const payload={action:'registrar_sesion',fecha:document.getElementById('inp-fecha').value,sesion:document.getElementById('inp-sesion').value,modo:'Modo '+S.mode,instrumento:S.selectedInstrumento,codigo:S.activeStudent.code,alumno:S.activeStudent.name,grupo:S.activeStudent.group,rol,ajuste:ajStr,nivel:nivel?nivel.name:(adjOpt?adjOpt.label:'—'),observacion:obsEl?obsEl.value:''};
  setSyncStatus('syncing');
  const btnReg=document.getElementById('btn-reg'); if(btnReg) btnReg.disabled=true;
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    S.sessionHistory.push({...payload,displayAj:ajStr});
    S.graded[S.activeStudent.code]=true;
    setSyncStatus('ok');
    toast('✓ '+fn(S.activeStudent)+' · '+S.selectedInstrumento+' · '+(aj>=0?'+':'')+aj);
    S.selectedNivel=null; S.selectedAdj=null; S.bonusActive=false;
    if(colaSorteos.length){ aceptarSorteo(colaSorteos[0].codigo); }
    else { S.activeStudent=null; S.mobStep=1; render(); }
  }catch(err){setSyncStatus('error');toast('Error al conectar',true);}
  finally{const b=document.getElementById('btn-reg');if(b)b.disabled=false;}
}

// ── MODO 3 (verbatim) ───────────────────────────────────────────────────────
function saveCurrentM3Eval(){
  const code=S.m3order[S.m3current];
  const obsEl=document.getElementById('inp-obs');
  S.m3evals[code]={rubric:{...S.m3rubric},obs:obsEl?obsEl.value:''};
  S.m3rubric={c1:null,c2:null,c3:null};
}
function validateM3Eval(){
  if(!S.m3rubric.c1||!S.m3rubric.c2||!S.m3rubric.c3){
    toast('Completa los 3 criterios de la rúbrica',true); return false;
  }
  return true;
}
async function submitAllM3(){
  const incompletos=[];
  S.m3order.forEach((code,i)=>{
    const ev=S.m3evals[code]||{}; const r=ev.rubric||{};
    if(!r.c1||!r.c2||!r.c3){
      const st=STUDENTS.find(s=>s.code===code);
      const label=i<3?'P'+(i+1):'R'+(i-2);
      incompletos.push(label+' '+shortName(st));
    }
  });
  if(incompletos.length>0){ toast('Rúbrica incompleta: '+incompletos.join(', '),true); return; }
  const fecha=document.getElementById('inp-fecha').value;
  const sesion=document.getElementById('inp-sesion').value;
  setSyncStatus('syncing');
  let ok=true;
  for(let i=0;i<S.m3order.length;i++){
    const code=S.m3order[i];
    const st=STUDENTS.find(s=>s.code===code);
    const isP=i<3;
    const ev=S.m3evals[code]||{}; const r=ev.rubric||{};
    const raw=(r.c1*0.5+r.c2*0.3+r.c3*0.2)*5;
    const ajuste=String(raw%1>=0.5?Math.ceil(raw):Math.floor(raw));
    const nivelStr='C1:'+r.c1+' C2:'+r.c2+' C3:'+r.c3;
    const label=isP?'P'+(i+1):'R'+(i-2);
    const payload={action:'registrar_sesion',fecha,sesion,modo:'Modo 3',instrumento:'TF',codigo:code,alumno:st.name,grupo:st.group,rol:label,ajuste,nivel:nivelStr,observacion:ev.obs||''};
    try{
      await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      S.sessionHistory.push({...payload,displayAj:ajuste});
    }catch(e){ok=false;}
  }
  setSyncStatus(ok?'ok':'error');
  toast(ok?'✓ '+S.m3order.length+' calificaciones enviadas':'Error al enviar',!ok);
  S.m3step=0; S.m3order=[]; S.m3evals={}; S.m3current=0; S.m3group=null;
  render();
}

// ── STATUS / TOAST (verbatim) ───────────────────────────────────────────────
function setSyncStatus(status){
  const el=document.getElementById('sync-dot'); if(!el) return;
  const map={syncing:['syncing','● Sincronizando…'],ok:['ok','● Guardado'],error:['error','● Error']};
  el.className='sync-dot '+map[status][0]; el.textContent=map[status][1];
  if(status==='ok') setTimeout(()=>{el.className='sync-dot ok';el.textContent='● Conectado';},2500);
}
function toast(msg,isErr=false){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.className=(isErr?'err ':'')+'show';
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),3000);
}

/* ═══════════════════════════════════════════════════════════════════════════
   CAPA DE PRESENTACIÓN — nueva. Un solo flujo por pasos, responsivo por CSS.
   ═══════════════════════════════════════════════════════════════════════════ */
const wrap=()=>document.getElementById('wrap');
const groupCls=g=>g==='GRUPO 1'?'grp-1':g==='GRUPO 2'?'grp-2':'grp-3';
const grpNames=()=>[...new Set(STUDENTS.map(s=>s.group))];

function render(){
  if(!STUDENTS.length){ return; }
  const w=wrap(); w.innerHTML='';
  if(S.mode===3) renderM3(w);
  else if(S.mode===2 && S.mobStep===0) renderInstr(w);
  else if(!S.activeStudent) renderStudentList(w);
  else renderGrade(w);
  refreshActionBar();
}

/* ── crumb helper ── */
function crumb(w, backFn, backLabel, label){
  const row=mkEl('div','crumb-row');
  if(backFn){
    const b=mkEl('button','crumb-back'); b.innerHTML='← '+backLabel;
    b.onclick=backFn; row.appendChild(b);
  }
  if(label){ const l=mkEl('div','crumb-label'); l.textContent=label; row.appendChild(l); }
  w.appendChild(row);
}

/* ── MODO 2: elegir instrumento ── */
function renderInstr(w){
  crumb(w,null,null,'Reporte parcial');
  const t=mkEl('div','screen-title'); t.textContent='¿Qué reporte evalúas?'; w.appendChild(t);
  const s=mkEl('div','screen-sub'); s.textContent='La dinámica de preguntas aplica a este RP.'; w.appendChild(s);
  const seg=mkEl('div','seg');
  INSTRUMENTOS_RP.forEach(id=>{
    const b=mkEl('button',S.selectedInstrumento===id?'on':'');
    b.textContent=id;
    b.onclick=()=>{ S.selectedInstrumento=id; S.mobStep=1; render(); };
    seg.appendChild(b);
  });
  w.appendChild(seg);
}

/* ── lista de alumnos ── */
function renderStudentList(w){
  if(S.mode===2) crumb(w, ()=>{S.mobStep=0;render();}, S.selectedInstrumento, 'Reporte parcial');
  else crumb(w,null,null,'Participación');
  const t=mkEl('div','screen-title');
  t.textContent = S.mode===1 ? '¿A quién calificas?' : 'Elige quién sustenta';
  w.appendChild(t);
  const s=mkEl('div','screen-sub');
  s.textContent = S.mode===1 ? 'Toca un alumno para registrar su participación.' : 'Toca el alumno de la dinámica.';
  w.appendChild(s);

  grpNames().forEach(g=>{
    const block=mkEl('div','grp-block '+groupCls(g));
    const gh=mkEl('div','grp-head'); gh.textContent=g; block.appendChild(gh);
    STUDENTS.filter(x=>x.group===g).forEach(st=>{
      const graded=!!S.graded[st.code];
      const row=mkEl('button','stu-row'+(graded?' graded':''));
      const veces=PART_CONTEOS[st.code]||0;
      const cc = veces>=META_PARTICIPACION ? 'ok' : 'low';
      const countHtml = S.mode===1 ? '<span class="stu-count '+cc+'">'+veces+'×</span>' : '';
      row.innerHTML='<span class="stu-ind">'+(graded?'✓':'')+'</span>'+
        '<span class="stu-name"><b>'+fn(st)+'</b><small>'+ln(st)+'</small></span>'+countHtml;
      row.onclick=()=>{ S.activeStudent=st; S.activeStudentOrigen='manual'; S.mobStep=2; render(); };
      block.appendChild(row);
    });
    w.appendChild(block);
  });
}

/* ── pantalla de calificación (Modo 1 y 2) ── */
function renderGrade(w){
  const st=S.activeStudent;
  crumb(w, ()=>{ S.activeStudent=null; S.selectedNivel=null; S.selectedAdj=null; S.bonusActive=false; S.mobStep=1; render(); },
        'Alumnos', S.mode===1?'Participación':(S.selectedInstrumento+' · dinámica'));

  const card=mkEl('div','active-card');
  card.innerHTML='<div class="ac-name">'+nmParts(st).given+' '+nmParts(st).family+'</div>'+
    '<div class="ac-meta">'+st.group+' · código '+st.code+'</div>'+
    (S.activeStudentOrigen==='sorteo'?'<span class="ac-badge">del sorteo</span>':'');
  w.appendChild(card);

  if(S.mode===1){
    const sec=mkEl('div','sec');
    sec.innerHTML='<div class="sec-label">Calificación de la intervención</div>';
    const grid=mkEl('div','choice-grid c3');
    ADJ_OPTS.forEach(o=>{
      const b=mkEl('button','choice'+(S.selectedAdj===o.id?' sel-'+o.id:''));
      b.innerHTML='<span class="ch-ic">'+o.icon+'</span><span class="ch-body"><span class="ch-name">'+o.label+'</span></span><span class="ch-val">'+o.value+'</span>';
      b.onclick=()=>{ S.selectedAdj=o.id; render(); };
      grid.appendChild(b);
    });
    sec.appendChild(grid); w.appendChild(sec);
  } else {
    // RP: banco de preguntas (referencia) + niveles
    const qs=mkEl('div','sec');
    qs.innerHTML='<div class="sec-label">Guía de preguntas · '+S.selectedInstrumento+'</div>';
    const bank=mkEl('div','qbank'); renderQuestions(bank,S.selectedInstrumento);
    qs.appendChild(bank); w.appendChild(qs);

    const nv=mkEl('div','sec');
    nv.innerHTML='<div class="sec-label">Desempeño oral</div>';
    const grid=mkEl('div','choice-grid');
    NIVELES.forEach(n=>{
      const b=mkEl('button','choice'+(S.selectedNivel===n.id?' sel-'+n.id:''));
      b.innerHTML='<span class="ch-ic">'+n.icon+'</span><span class="ch-body"><span class="ch-name">'+n.name+'</span><span class="ch-desc">'+n.desc+'</span></span><span class="ch-val">'+n.effect+'</span>';
      b.onclick=()=>{ S.selectedNivel=n.id; render(); };
      grid.appendChild(b);
    });
    nv.appendChild(grid); w.appendChild(nv);

    const bs=mkEl('div','sec');
    bs.innerHTML='<div class="sec-label">Bonus</div>';
    const bt=mkEl('button','bonus-toggle'+(S.bonusActive?' on':''));
    bt.innerHTML='<span class="bt-box">'+(S.bonusActive?'✓':'')+'</span><span class="bt-label">Intervención destacada (+1)</span>';
    bt.onclick=()=>{ S.bonusActive=!S.bonusActive; render(); };
    bs.appendChild(bt); w.appendChild(bs);
  }

  // readout
  const ro=mkEl('div','readout');
  ro.innerHTML='<div><div class="ro-label">Ajuste a registrar</div><div class="ro-calc" id="aj-calc">—</div></div><div class="ro-value" id="aj-value">—</div>';
  w.appendChild(ro);

  // nota
  const ns=mkEl('div','sec');
  ns.innerHTML='<div class="sec-label">Observación <span style="color:var(--ink-dim);text-transform:none;letter-spacing:0">(opcional)</span></div>';
  const ta=mkEl('textarea','note-area'); ta.id='inp-obs'; ta.placeholder='Notas para ti…';
  ns.appendChild(ta); w.appendChild(ns);

  buildHistory(w);
  updateAjuste();
}

/* ── banco de preguntas (referencia, colapsable con <details>) ── */
function renderQuestions(container,instr){
  const qBank=QUESTIONS[instr]; if(!qBank) return;
  Object.entries(qBank).forEach(([key,dim])=>{
    const allQs=Object.values(dim.levels).flat();
    const used=()=>allQs.filter(q=>S.usedQuestions.has(q)).length;
    const d=mkEl('details',dim.cls);
    const sum=mkEl('summary');
    sum.innerHTML='<span class="q-num">'+dim.num+'</span>'+dim.title+
      '<span class="q-used" id="qu-'+key+'">'+used()+'/'+allQs.length+'</span><span class="q-arrow">▸</span>';
    d.appendChild(sum);
    const body=mkEl('div','q-body');
    Object.entries(dim.levels).forEach(([lvl,qs])=>{
      if(!qs.length) return;
      const lh=mkEl('div','q-lvl'); lh.textContent='Nivel '+lvl; body.appendChild(lh);
      qs.forEach(q=>{
        const item=mkEl('div','q-pick'+(S.usedQuestions.has(q)?' used':''));
        item.innerHTML='<span class="q-chk">'+(S.usedQuestions.has(q)?'✓':'')+'</span><span class="q-txt">'+q+'</span>';
        item.onclick=(e)=>{
          e.stopPropagation();
          if(S.usedQuestions.has(q)) S.usedQuestions.delete(q); else S.usedQuestions.add(q);
          item.classList.toggle('used'); item.querySelector('.q-chk').textContent=S.usedQuestions.has(q)?'✓':'';
          const qu=document.getElementById('qu-'+key); if(qu) qu.textContent=used()+'/'+allQs.length;
        };
        body.appendChild(item);
      });
    });
    d.appendChild(body);
    container.appendChild(d);
  });
}

/* ── historial (colapsable) ── */
function buildHistory(w){
  const tog=mkEl('button','hist-toggle');
  tog.innerHTML=(S.histOpen?'▾':'▸')+' Registros de esta sesión ('+S.sessionHistory.length+')';
  const list=mkEl('div'); list.id='hist-list'; list.style.display=S.histOpen?'block':'none';
  tog.onclick=()=>{ S.histOpen=!S.histOpen; tog.innerHTML=(S.histOpen?'▾':'▸')+' Registros de esta sesión ('+S.sessionHistory.length+')'; list.style.display=S.histOpen?'block':'none'; renderHistory(); };
  w.appendChild(tog); w.appendChild(list);
  if(S.histOpen) renderHistory();
}
function renderHistory(){
  const c=document.getElementById('hist-list'); if(!c) return;
  if(!S.sessionHistory.length){ c.innerHTML='<div class="empty" style="padding:18px">Sin registros aún</div>'; return; }
  c.innerHTML='';
  [...S.sessionHistory].reverse().forEach(r=>{
    const isM3=r.modo==='Modo 3';
    const num=parseFloat(r.displayAj);
    const cls=isM3?'neu':num>0?'pos':num<0?'neg':'neu';
    const adjTxt=isM3?r.displayAj:((num>=0?'+':'')+num);
    const it=mkEl('div','hist-item');
    it.innerHTML='<div class="hi-adj '+cls+'">'+adjTxt+'</div><div><div class="hi-name">'+r.alumno.split(' ').slice(0,2).join(' ')+'</div><div class="hi-meta">'+r.instrumento+' · '+(isM3?'Nota TF · '+r.nivel:r.nivel)+'</div>'+(r.observacion?'<div class="hi-obs">'+r.observacion+'</div>':'')+'</div>';
    c.appendChild(it);
  });
}

/* ═══════════ MODO 3 · SUSTENTACIÓN TF ═══════════ */
function renderM3(w){
  if(!S.m3group){ renderM3Group(w); return; }
  if(S.m3step===0) renderM3Assign(w);
  else if(S.m3step===1) renderM3Confirm(w);
  else if(S.m3step===2) renderM3Eval(w);
  else renderM3Review(w);
}
function renderM3Group(w){
  crumb(w,null,null,'Sustentación TF');
  const t=mkEl('div','screen-title'); t.textContent='¿Qué grupo sustenta?'; w.appendChild(t);
  const s=mkEl('div','screen-sub'); s.textContent='Luego asignas el orden de presentación.'; w.appendChild(s);
  grpNames().forEach(g=>{
    const n=STUDENTS.filter(x=>x.group===g).length;
    const b=mkEl('button','stu-row');
    b.innerHTML='<span class="stu-name"><b>'+g+'</b><small>'+n+' integrantes</small></span>';
    b.onclick=()=>{ S.m3group=g; S.m3order=[]; S.m3evals={}; S.m3current=0; S.m3step=0; render(); };
    w.appendChild(b);
  });
}
function renderM3Assign(w){
  crumb(w, ()=>{S.m3group=null;render();}, 'Grupos', S.m3group+' · orden');
  const members=STUDENTS.filter(s=>s.group===S.m3group);
  const needed=members.length, nR=needed-3;
  const t=mkEl('div','screen-title'); t.textContent='Asignar orden'; w.appendChild(t);
  const s=mkEl('div','screen-sub');
  s.textContent='Toca en orden: primero los 3 presentadores (P1–P3), luego los '+nR+' respondedores (R1–R'+nR+').';
  w.appendChild(s);
  members.forEach(st=>{
    const idx=S.m3order.indexOf(st.code);
    const row=mkEl('button','m3-row'+(idx!==-1?' assigned':''));
    let badge='<span class="m3-badge">—</span>';
    if(idx!==-1){ const lbl=idx<3?'P'+(idx+1):'R'+(idx-2); badge='<span class="m3-badge '+(idx<3?'p':'r')+'">'+lbl+'</span>'; }
    row.innerHTML=badge+'<span class="m3-nm">'+shortName(st)+'</span>';
    row.onclick=()=>{
      const i=S.m3order.indexOf(st.code);
      if(i!==-1) S.m3order.splice(i,1);
      else if(S.m3order.length<needed) S.m3order.push(st.code);
      render();
    };
    w.appendChild(row);
  });
}
function renderM3Confirm(w){
  crumb(w, ()=>{S.m3step=0;render();}, 'Corregir', S.m3group+' · confirmar');
  const t=mkEl('div','screen-title'); t.textContent='Revisa el orden'; w.appendChild(t);
  const s=mkEl('div','screen-sub'); s.textContent='Cada presentador va con su sección del trabajo.'; w.appendChild(s);
  S.m3order.forEach((code,i)=>{
    const st=STUDENTS.find(x=>x.code===code);
    const isP=i<3; const lbl=isP?'P'+(i+1):'R'+(i-2);
    const row=mkEl('div','m3-row');
    row.innerHTML='<span class="m3-badge '+(isP?'p':'r')+'">'+lbl+'</span><span class="m3-nm">'+shortName(st)+'</span>'+
      '<span class="m3-sec">'+(isP?TF_SECTIONS[i]:'Preguntas del profesor')+'</span>';
    w.appendChild(row);
  });
}
function renderM3Eval(w){
  const allCodes=S.m3order;
  const code=allCodes[S.m3current];
  const st=STUDENTS.find(x=>x.code===code);
  const idx=S.m3current, isP=idx<3, lbl=isP?'P'+(idx+1):'R'+(idx-2);

  crumb(w, ()=>{ if(S.m3current>0){saveCurrentM3Eval();S.m3current--;render();} else {S.m3step=1;render();} },
        S.m3current>0?'Anterior':'Orden', S.m3group+' · '+(idx+1)+'/'+allCodes.length);

  const prog=mkEl('div','m3-prog');
  allCodes.forEach((_,i)=>{ const d=mkEl('i',i<S.m3current?'done':i===S.m3current?'now':''); prog.appendChild(d); });
  w.appendChild(prog);

  const card=mkEl('div','active-card');
  card.innerHTML='<div class="ac-name">'+shortName(st)+'</div><div class="ac-meta">'+lbl+' · '+(isP?TF_SECTIONS[idx]:'Respondedor')+'</div>';
  w.appendChild(card);

  const saved=S.m3evals[code]||{};
  S.m3rubric=saved.rubric?{...saved.rubric}:{c1:null,c2:null,c3:null};

  RUBRIC_CRITERIA.forEach(cr=>{
    const block=mkEl('div','rub-crit');
    block.innerHTML='<div class="rub-crit-hd"><b>'+cr.label+'</b><span>'+Math.round(cr.peso*100)+'%</span></div>';
    const scale=mkEl('div','rub-scale');
    cr.levels.forEach((l,i)=>{
      const val=i+1;
      const b=mkEl('button','rub-btn'+(S.m3rubric[cr.id]===val?' sel':''));
      b.innerHTML='<span class="rb-n">'+val+'</span><span class="rb-l">'+l+'</span>';
      b.onclick=()=>{ S.m3rubric[cr.id]=val; scale.querySelectorAll('.rub-btn').forEach((x,j)=>x.classList.toggle('sel',j+1===val)); updateNotaTF(); };
      scale.appendChild(b);
    });
    block.appendChild(scale); w.appendChild(block);
  });

  const ro=mkEl('div','readout');
  ro.innerHTML='<div><div class="ro-label">Nota de sustentación (0–20)</div><div class="ro-calc" id="nota-tf-calc">Completa los 3 criterios</div></div><div class="ro-value" id="nota-tf-value">—</div>';
  w.appendChild(ro);

  const ns=mkEl('div','sec');
  ns.innerHTML='<div class="sec-label">Observación</div>';
  const ta=mkEl('textarea','note-area'); ta.id='inp-obs'; ta.placeholder='Notas…'; ta.value=saved.obs||'';
  ns.appendChild(ta); w.appendChild(ns);
  updateNotaTF();
}
function renderM3Review(w){
  crumb(w, ()=>{ S.m3current=S.m3order.length-1; S.m3step=2; render(); }, 'Editar', S.m3group+' · revisar');
  const t=mkEl('div','screen-title'); t.textContent='Revisar y enviar'; w.appendChild(t);
  const s=mkEl('div','screen-sub'); s.textContent='Toca a un alumno para corregir su nota.'; w.appendChild(s);
  S.m3order.forEach((code,i)=>{
    const st=STUDENTS.find(x=>x.code===code);
    const isP=i<3; const lbl=isP?'P'+(i+1):'R'+(i-2);
    const ev=S.m3evals[code]||{}; const r=ev.rubric||{};
    let nota='—';
    if(r.c1&&r.c2&&r.c3){ const raw=(r.c1*0.5+r.c2*0.3+r.c3*0.2)*5; nota=String(raw%1>=0.5?Math.ceil(raw):Math.floor(raw)); }
    const row=mkEl('button','m3-row');
    row.innerHTML='<span class="m3-badge '+(isP?'p':'r')+'">'+lbl+'</span><span class="m3-nm">'+shortName(st)+'</span>'+
      '<span class="m3-nota">'+nota+'<small> / 20</small></span>';
    row.onclick=()=>{ S.m3current=i; S.m3step=2; render(); };
    w.appendChild(row);
  });
}

/* ═══════════ BARRA DE ACCIÓN (sticky, safe-area) ═══════════ */
function refreshActionBar(){
  const bar=document.getElementById('action-bar');
  const inner=document.getElementById('ab-inner');
  const hint=document.getElementById('ab-hint');
  let html='', hintTxt='', show=true;

  if(S.mode===3){
    if(!S.m3group){ show=false; }
    else if(S.m3step===0){
      const needed=STUDENTS.filter(s=>s.group===S.m3group).length;
      const ready=S.m3order.length===needed;
      html='<button class="btn-primary wide" '+(ready?'':'disabled')+' onclick="S.m3step=1;render()">Ver resumen ('+S.m3order.length+'/'+needed+') →</button>';
    }
    else if(S.m3step===1){
      html='<button class="btn-ghost" onclick="S.m3step=0;render()">Corregir</button>'+
           '<button class="btn-primary" onclick="S.m3current=0;S.m3evals={};S.m3step=2;render()">Comenzar evaluación →</button>';
    }
    else if(S.m3step===2){
      const isLast=S.m3current===S.m3order.length-1;
      html='<button class="btn-primary wide" onclick="m3Next()">'+(isLast?'Revisar y enviar →':'Siguiente alumno →')+'</button>';
    }
    else if(S.m3step===3){
      html='<button class="btn-primary wide" onclick="submitAllM3()">↗ Enviar todo al Sheet</button>';
    }
  }
  else if(S.mode===2 && S.mobStep===0){ show=false; }
  else if(!S.activeStudent){ show=false; }
  else {
    const aj=calcAjuste();
    const ready = aj!==null;
    html='<button class="btn-primary wide" id="btn-reg" '+(ready?'':'disabled')+' onclick="registrar()">↗ Registrar</button>';
    if(!ready) hintTxt = S.mode===1 ? 'Elige Destaca / Cumple / No cumple' : 'Elige un nivel de desempeño';
  }

  if(!show){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
  inner.innerHTML=html;
  if(hintTxt){ hint.style.display='block'; hint.textContent=hintTxt; } else { hint.style.display='none'; }
}
function m3Next(){
  if(!validateM3Eval()) return;
  saveCurrentM3Eval();
  if(S.m3current===S.m3order.length-1){ S.m3step=3; render(); }
  else { S.m3current++; render(); }
}

window.addEventListener('resize',()=>{ /* layout es CSS; nada que re-renderizar */ });
