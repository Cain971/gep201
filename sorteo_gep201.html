<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo GEP201</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   TABLERO DE SALIDAS — identidad del sorteo (se proyecta en clase).
   Cada letra es una paleta que gira y se detiene (split-flap / Solari).
   Letras crema sobre paletas negras: máximo contraste en el ecran.
   Tipografías compartidas con los decks (Archivo + IBM Plex Mono).
   Colores fijos: no dependen del modo oscuro de la PC del salón.
   ═══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141414; --panel:#0B0B0B; --edge:#2A2A2A; --flap:#1E1E1E; --flap2:#262626; --seam:#050505;
  --char:#F3E7C8; --dim:#9A9384; --mute:#5F5A51; --amber:#F2B632;
  --g1:#6FA3E0; --g2:#62C08E; --g3:#C98BC0; --danger:#E0786E;
  --accent:#F2B632; --on-accent:#1A1405;   /* para la pantalla de clave (gep201-api.js) */
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Archivo',system-ui,sans-serif;
  --ease:cubic-bezier(0.23,1,0.32,1);
}
html,body{background:var(--bg); color:var(--char)}
body{font-family:var(--sans); padding:30px 36px 40px; min-height:100vh}
.wrap{max-width:1240px; margin:0 auto}
button{font:inherit; color:inherit; cursor:pointer}

/* ── cabecera ── */
.top{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:20px}
.kick{font-family:var(--mono); font-weight:700; font-size:15px; letter-spacing:.3em; color:var(--amber)}
.title{font-weight:900; font-size:clamp(34px,4vw,54px); line-height:1.02; letter-spacing:.005em; margin-top:6px}
.clock{font-family:var(--mono); font-weight:600; font-size:clamp(32px,3.6vw,48px); letter-spacing:.04em; text-align:right; line-height:1}
.clock small{display:block; font-size:13px; letter-spacing:.3em; color:var(--dim); margin-bottom:8px}

/* ── barra de control ── */
.bar{display:flex; align-items:center; gap:18px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:12px 16px; margin-bottom:14px}
.tabs{display:flex; gap:6px; margin-right:auto}
.tabs button{font-family:var(--mono); font-weight:600; font-size:14px; letter-spacing:.12em; padding:10px 14px; border-radius:6px; border:none; background:none; color:var(--dim); transition:background-color .15s ease, color .15s ease}
.tabs button.on{background:var(--amber); color:#1a1405}
.tabs button:disabled{cursor:default}
#ctls{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.ctl{display:flex; align-items:center; gap:10px}
.ctl label{font-family:var(--mono); font-size:12px; letter-spacing:.2em; color:var(--dim)}
.stepper{display:flex; align-items:center; gap:8px}
.stepper button{width:40px; height:40px; border-radius:6px; border:1px solid #363636; background:var(--flap); color:var(--char); font:600 20px var(--mono)}
.stepper button:disabled{opacity:.3; cursor:not-allowed}
.stepper .val{font:700 24px var(--mono); min-width:28px; text-align:center; color:var(--amber)}
.btn{height:44px; padding:0 24px; border-radius:6px; border:none; background:var(--char); color:#141414; font:700 15px var(--mono); letter-spacing:.12em; transition:transform .16s var(--ease), opacity .15s ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3; cursor:not-allowed; transform:none}
.btn.ghost{background:transparent; color:var(--dim); border:1px solid #3a3a3a; height:38px; font-size:13px; padding:0 14px}
.btn.ghost.on{color:var(--char); border-color:var(--char)}
.snd{width:44px; height:44px; border-radius:6px; border:1px solid #363636; background:var(--flap); color:var(--char); display:flex; align-items:center; justify-content:center}
.snd svg{width:22px; height:22px}
.snd.off{color:var(--mute)}
/* Modo ensayo: gira y suena igual, pero no registra nada. Se nota a la vista. */
.ens{height:44px; padding:0 14px; border-radius:6px; border:1px dashed #4a4a4a; background:transparent; color:var(--dim); font:600 13px var(--mono); letter-spacing:.12em}
.ens.on{border-color:var(--amber); color:var(--amber); background:rgba(242,182,50,.08)}
body.ensayo .board, body.ensayo .gcard{border:1px dashed var(--amber)}
.ens-aviso{display:none; font:700 13px var(--mono); letter-spacing:.2em; color:#1a1405; background:var(--amber); padding:4px 10px; border-radius:4px; margin-left:12px; vertical-align:middle}
body.ensayo .ens-aviso{display:inline-block}

/* ── tablero ── */
.board{background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:16px 20px 20px}
.hdr,.line{display:grid; grid-template-columns:64px minmax(0,1fr) 170px; gap:16px; align-items:center}
.hdr{font-family:var(--mono); font-weight:600; font-size:13px; letter-spacing:.3em; color:var(--dim); padding:0 4px 12px; border-bottom:1px solid #222; margin-bottom:12px}
.line{padding:8px 4px}
.idx{font:700 30px var(--mono); color:var(--mute); transition:color .3s ease}
.line.locked .idx{color:var(--amber)}
.flaps{display:flex; gap:var(--gap,5px); perspective:600px; --fw:46px; min-width:0}
.f{width:var(--fw); height:calc(var(--fw) * 1.5); background:linear-gradient(var(--flap2) 0 50%, var(--flap) 50% 100%); border-radius:calc(var(--fw) * .1);
   position:relative; display:flex; align-items:center; justify-content:center; flex-shrink:0;
   font-family:var(--mono); font-weight:700; font-size:var(--fw); line-height:1; color:var(--char); overflow:hidden}
.f::after{content:''; position:absolute; left:0; right:0; top:50%; height:2px; margin-top:-1px; background:var(--seam)}   /* ranura de la paleta */
.f span{display:block; will-change:transform; backface-visibility:hidden}
.f.blank span{color:transparent}
.grp{display:flex; align-items:center; gap:10px; font:600 18px var(--mono); letter-spacing:.1em; color:var(--mute); transition:color .3s ease}
.lamp{width:14px; height:14px; border-radius:50%; background:#2b2b2b; flex-shrink:0; transition:background-color .3s ease}
.line.locked .grp{color:var(--char)}
.line.locked.g1 .lamp{background:var(--g1)} .line.locked.g2 .lamp{background:var(--g2)} .line.locked.g3 .lamp{background:var(--g3)}
.full{grid-column:2; font:500 15px var(--mono); color:var(--dim); letter-spacing:.04em; min-height:20px; margin-top:-2px}

/* ── lista de la clase ── */
.roster{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:14px}
@media(max-width:860px){ .roster,.groups{grid-template-columns:1fr} }
.col{background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:14px 18px}
.col h3,.gh{font:600 13px var(--mono); letter-spacing:.3em; margin-bottom:8px}
.g1 h3,.g1 .gh{color:var(--g1)} .g2 h3,.g2 .gh{color:var(--g2)} .g3 h3,.g3 .gh{color:var(--g3)}
.row,.mrow{display:flex; justify-content:space-between; gap:10px; font:500 15px var(--mono); padding:5px 0; color:var(--dim); transition:color .2s ease}
.row.picked,.mrow.sel{color:var(--char); font-weight:700}

/* ── reportes parciales: una tarjeta por grupo ── */
.groups{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
.gcard{min-width:0; background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px}
.gcard .gsub{font:500 13px var(--mono); color:var(--dim); margin-top:-6px}
.gres{display:flex; flex-direction:column; gap:10px; min-height:60px}
.gline{display:flex; flex-direction:column; gap:4px}
.gline .fam{font:600 15px var(--mono); letter-spacing:.06em; color:var(--dim); min-height:19px}
.mlist{border-top:1px solid #222; padding-top:8px; flex:1}

/* ── trabajo final ── */
.tfp{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.tfp button{font:600 14px var(--mono); letter-spacing:.08em; padding:10px 16px; border-radius:6px; border:1px solid #363636; background:var(--flap); color:var(--dim)}
.tfp button.on{color:var(--char); border-color:var(--char)}
.tfp b{color:var(--amber); margin-right:6px}
.seq{font:500 14px var(--mono); letter-spacing:.06em; color:var(--dim); margin-bottom:12px}
.seq span{color:var(--char)}
.role{font:700 20px var(--mono); color:var(--mute); transition:color .3s ease}
.line.locked .role.p{color:var(--amber)} .line.locked .role.r{color:var(--char)}
.sec{font:500 13px var(--mono); color:var(--dim); letter-spacing:.04em; line-height:1.3}
.split{height:1px; background:#222; margin:8px 0}
.ph{font:500 14px var(--mono); color:var(--mute); padding:22px 4px}
.load-err{padding:40px; text-align:center; color:var(--danger); font:500 15px/1.6 var(--mono)}
.load-err .btn{margin-top:18px}

.foot{margin-top:14px; font:600 12px var(--mono); letter-spacing:.2em; color:var(--mute); display:flex; justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="kick"><span id="kick">GEP201 · PARTICIPACIÓN</span><span class="ens-aviso">ENSAYO · NO SE REGISTRA</span></div><div class="title" id="title">Próximo en responder</div></div>
    <div class="clock"><small id="fecha"></small><span id="hora"></span></div>
  </div>
  <div class="bar">
    <nav class="tabs" id="mode-nav">
      <button data-m="part" class="on">PARTICIPACIÓN</button>
      <button data-m="rp">REPORTES</button>
      <button data-m="tf">TRABAJO FINAL</button>
    </nav>
    <div id="ctls"></div>
    <button class="ens" id="ens" title="Ensayo: sortea sin registrar nada en el Sheet" aria-pressed="false">ENSAYO</button>
    <button class="snd" id="snd" title="Sonido del tablero" aria-label="Sonido del tablero"></button>
  </div>
  <div id="app"><div class="ph">Cargando lista de alumnos…</div></div>
  <div class="foot"><span>GEP201 · FGAD · PUCP</span><span id="sync"></span></div>
</div>

<script src="gep201-api.js?v=3"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   BACKEND — la conexión (clave, lecturas, cola de envío con reintento) vive
   en gep201-api.js, compartido con index.html.
   ═══════════════════════════════════════════════════════════════════════ */

// Clases que quedan en el semestre (incluida hoy): se calculan solas contando
// los miércoles hasta ULTIMA_CLASE. Solo afecta la urgencia de la ponderación
// en Participación. Semestre 2026-2: última clase confirmada por el docente
// (2026-09-23). Agregar a SIN_CLASE cualquier miércoles sin clase (feriado, parciales).
const ULTIMA_CLASE = '2026-11-25';   // confirmada
const SIN_CLASE = [];          // ej. ['2026-10-14']
function clasesRestantes(){
  const fin = new Date(ULTIMA_CLASE + 'T12:00:00');
  const d = new Date(GEP.hoyLocal() + 'T12:00:00');
  let n = 0;
  for (; d <= fin; d.setDate(d.getDate() + 1)){
    if (d.getDay() !== 3) continue;
    const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if (!SIN_CLASE.includes(iso)) n++;
  }
  return Math.max(1, n);
}
const CLASES_RESTANTES = clasesRestantes();
const META_SORTEOS = 2;   // veces que debería tocarle a cada alumno en el semestre (solo Participación)

/* ═══════════════════════════════════════════════════════════════════════
   DATOS — se llenan desde la hoja "Nomina" (action=nomina) al cargar.
   Para un semestre futuro: editar solo esa hoja, no este archivo.
   ═══════════════════════════════════════════════════════════════════════ */
let GRUPOS = {};       // { "GRUPO 1": [ {code,name,nombres,apellidos,group}, ... ] }
let ALL = [];          // lista plana de todos los alumnos
let GCLS = {};         // "GRUPO 1" -> "g1"
let GNUM = {};         // "GRUPO 1" -> "01"
let CONTEOS = {};      // code -> veces participado en el semestre (desde el backend)
// Códigos ya sorteados hoy. Se guardan en el equipo: si se recarga la página a
// mitad de clase, quien ya salió no vuelve a ser favorito del sorteo.
const SALIDOS_KEY = 'gep201_sorteo_salidos';
const salidoHoy = (()=>{ const g = GEP.store.get(SALIDOS_KEY, null); return new Set(g && g.fecha === GEP.hoyLocal() ? g.codes : []); })();
const guardarSalidos = () => GEP.store.set(SALIDOS_KEY, { fecha: GEP.hoyLocal(), codes: [...salidoHoy] });

const SECCIONES_TF = ["Sección 1 · Diagnóstico","Sección 2 · Modelos MC/ME","Sección 3 · Teoría de Cambio"];

/* ---------- helpers ---------- */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const rnd = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
const nm = st => GEP.nombre(st);   // {given, family, first, fam1, short, full}
const up = s => String(s).toUpperCase();
const esc = s => String(s).replace(/'/g, "\\'");

/* ── reloj y fecha (como un tablero de aeropuerto) ── */
(function reloj(){
  const md=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  const pinta=()=>{ const d=new Date();
    document.getElementById('hora').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    document.getElementById('fecha').textContent=String(d.getDate()).padStart(2,'0')+' '+md[d.getMonth()]+' '+d.getFullYear(); };
  pinta(); setInterval(pinta, 10000);
})();

/* ═══════════════════════════════════════════════════════════════════════
   SONIDO — el "clac" de las paletas, sintetizado (sin archivos de audio).
   Mientras muchas paletas giran se oye un traqueteo continuo; a medida que
   se detienen, el sonido se ralea y cada paleta que se fija da un golpe
   más grave: la desaceleración también se escucha. Botón para silenciar
   (se recuerda en el equipo). El audio arranca con el primer clic, como
   exigen los navegadores.
   ═══════════════════════════════════════════════════════════════════════ */
const Sonido = (() => {
  let ctx = null, ruido = null, ultimo = 0;
  let on = GEP.store.get('gep201_sonido', true);
  function init(){
    if (ctx || !on) return;
    try{
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      ruido = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.03), ctx.sampleRate);
      const d = ruido.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 7);
    }catch(e){ ctx = null; }
  }
  function golpe(vol, frec, vel){
    if (!on || !ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const s = ctx.createBufferSource(); s.buffer = ruido; s.playbackRate.value = vel;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = frec; f.Q.value = 1.4;
    const g = ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(ctx.destination); s.start();
  }
  return {
    init,
    // traqueteo: como máximo un golpe cada 24 ms aunque giren muchas paletas
    giro(){ const t = performance.now(); if (t - ultimo < 24) return; ultimo = t; golpe(0.22, 2200 + Math.random() * 900, 0.95 + Math.random() * 0.2); },
    fija(){ golpe(0.55, 1300 + Math.random() * 300, 0.8); },
    get on(){ return on; },
    toggle(){ on = !on; GEP.store.set('gep201_sonido', on); if (on) init(); return on; },
  };
})();
const ICONO_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const ICONO_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
function pintaSonido(){ const b = document.getElementById('snd'); b.innerHTML = Sonido.on ? ICONO_ON : ICONO_OFF; b.classList.toggle('off', !Sonido.on); b.setAttribute('aria-pressed', String(Sonido.on)); }
document.getElementById('snd').addEventListener('click', () => { Sonido.toggle(); pintaSonido(); });
pintaSonido();

/* ═══════════════════════════════════════════════════════════════════════
   PALETAS — el revelado
   · Cada paleta gira a ritmo constante (como un tablero real): cae con
     rotateX 88°→0 en 70 ms. Solo transform/opacity.
   · El suspenso está en la CASCADA: las letras se fijan en ORDEN ALEATORIO
     y cada vez más lento — el aula va adivinando el nombre y las últimas
     letras caen despacio. Los espacios también giran hasta su turno, para
     que ni el largo del nombre ni el corte nombre/apellido lo delaten.
     Después, pausa breve y se enciende la lámpara.
   · Movimiento reducido (ajuste del sistema): sin giros; fundido de 200 ms.
   ═══════════════════════════════════════════════════════════════════════ */
const REDUCIR = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE_OUT = 'cubic-bezier(0.23, 1, 0.32, 1)';
const ABC = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZÁÉÍÓÚ';
const TICK = 62;   // ms entre giros de una paleta

function flapsHTML(n, texto){
  const t = (texto || '').padEnd(n, ' ');
  return Array.from({ length: n }, (_, c) => {
    const ch = t[c];
    return `<div class="f${ch === ' ' ? ' blank' : ''}"><span>${ch === ' ' ? '·' : ch}</span></div>`;
  }).join('');
}
// Ajusta el ancho de paleta al espacio disponible (el tablero nunca desborda).
function ajustar(cont){
  const n = +cont.dataset.n, max = +cont.dataset.fw;
  const gap = Math.max(3, Math.round(Math.min(max, cont.clientWidth / n) * 0.1));
  const fw = Math.max(16, Math.min(max, Math.floor((cont.clientWidth - gap * (n - 1)) / n)));
  cont.style.setProperty('--fw', fw + 'px'); cont.style.setProperty('--gap', gap + 'px');
}
const ajustarTodo = (root = document) => root.querySelectorAll('.flaps[data-n]').forEach(ajustar);
window.addEventListener('resize', () => ajustarTodo());

function fijar(f, ch){
  const s = f.querySelector('span');
  f.classList.toggle('blank', ch === ' ');
  s.textContent = ch === ' ' ? '·' : ch;
  if (REDUCIR) return;
  s.animate([{ transform:'rotateX(88deg)' }, { transform:'rotateX(-10deg)', offset:.72 }, { transform:'rotateX(0)' }], { duration:170, easing:EASE_OUT });
}
async function paleta(f, ch, alto){
  const s = f.querySelector('span');
  f.classList.remove('blank');
  const t0 = performance.now();
  while (performance.now() - t0 < alto){
    s.textContent = ABC[Math.floor(Math.random() * ABC.length)];
    s.animate([{ transform:'rotateX(88deg)', opacity:.45 }, { transform:'rotateX(0)', opacity:1 }], { duration:70, easing:EASE_OUT });
    Sonido.giro();
    await sleep(TICK);
  }
  fijar(f, ch);
  if (ch !== ' ') Sonido.fija();
}
/* Revela `texto` en un contenedor de paletas. base = ms hasta que se fija la
   primera paleta; cola = ms extra que se reparten, cada vez más lentos, en las
   siguientes (curva potencia 2.2: rápido al inicio, lento al final). El turno
   de cada paleta es aleatorio. */
async function revelar(cont, texto, { base = 700, cola = 1500 } = {}){
  const fs = [...cont.querySelectorAll('.f')];
  const t = texto.padEnd(fs.length, ' ');
  if (REDUCIR){
    fs.forEach((f, c) => fijar(f, t[c]));
    cont.animate([{ opacity:0 }, { opacity:1 }], { duration:200, easing:'ease' });
    await sleep(250); return;
  }
  const n = fs.length, turno = shuffle(fs.map((_, c) => c));   // turno[k] = paleta que se fija en k-ésimo lugar
  const alto = new Array(n);
  turno.forEach((c, k) => { alto[c] = base + k * 45 + Math.pow(k / Math.max(1, n - 1), 2.2) * cola; });
  await Promise.all(fs.map((f, c) => paleta(f, t[c], alto[c])));
}
// Encendido de una línea tras revelar: pausa breve, lámpara y grupo.
async function encender(line, grupo){
  await sleep(REDUCIR ? 0 : 180);
  line.classList.add('locked');
  if (GCLS[grupo]) line.classList.add(GCLS[grupo]);
}

/* Ancho del tablero: el nombre corto más largo de la clase (máx. 24 paletas;
   si hace falta, las paletas se achican). Un nombre de más de 24 letras
   abrevia el apellido ("MAXIMILIANO V."); el nombre completo va debajo.
   WF = primer nombre más largo (tarjetas de RP). */
let W = 17, WF = 10;
const MAX_W = 24;
const enTablero = st => { const n = nm(st); return up(n.short.length <= MAX_W ? n.short : (n.first + ' ' + n.fam1[0] + '.')); };
function medirAnchos(){
  W = Math.min(MAX_W, Math.max(12, ...ALL.map(st => nm(st).short.length)));
  WF = Math.min(12, Math.max(6, ...ALL.map(st => nm(st).first.length)));
}

/* ═══════════════════════════════════════════════════════════════════════
   CARGA DE NÓMINA Y CONTEOS
   ═══════════════════════════════════════════════════════════════════════ */
async function cargarNomina(){
  try{
    const alumnos = await GEP.conClave(GEP.cargarNomina);
    // Grupos siempre en orden correlativo (GRUPO 1, 2, 3), sin importar el
    // orden de las filas en la pestaña Nomina. (El orden de Trabajo Final lo
    // decide su propio sorteo, en S.tfOrden.)
    const porGrupo = {};
    alumnos.forEach(a => (porGrupo[a.group] = porGrupo[a.group] || []).push(a));
    const numGrupo = g => { const m = String(g).match(/\d+/); return m ? parseInt(m[0], 10) : Infinity; };
    GRUPOS = {};
    Object.keys(porGrupo).sort((x, y) => numGrupo(x) - numGrupo(y) || String(x).localeCompare(String(y)))
      .forEach(g => { GRUPOS[g] = porGrupo[g]; });
    ALL = Object.values(GRUPOS).flat();
    // Color y número por el dígito de "GRUPO N" (GRUPO 1 = azul, 2 = verde, 3 = morado);
    // si el nombre no trae número, se asigna por orden de aparición.
    Object.keys(GRUPOS).forEach((g,i)=>{
      const num = (String(g).match(/\d+/) || [])[0];
      const n = num ? parseInt(num,10) : i+1;
      GCLS[g] = 'g' + (((n-1) % 3) + 1);
      GNUM[g] = String(n).padStart(2,'0');
    });
    medirAnchos();
    render();
    cargarConteos();
  }catch(e){
    console.error('No se pudo cargar la nómina', e);
    document.getElementById('app').innerHTML =
      '<div class="load-err">No se pudo cargar la lista de alumnos.<br><small>Causa: ' + GEP.describirError(e) + '</small><br><button class="btn" onclick="this.disabled=true;cargarNomina()">REINTENTAR</button></div>';
  }
}
async function cargarConteos(){
  try{ CONTEOS = await GEP.cargarConteos(); if (!S.busy) refrescarListas(); }
  catch(e){ /* silencioso: si falla, los contadores quedan en 0 hasta la próxima consulta */ }
}

/* ═══════════════════════════════════════════════════════════════════════
   PONDERACIÓN
   Participación: sesgo hacia quien menos ha salido, con urgencia si se
   acaban las clases para llegar a la meta, y piso bajo (no cero) para
   quien ya cumplió — así nadie se siente "a salvo".
   RP: casi uniforme — el sorteo asigna quién sustenta, no reparte cobertura.
   ═══════════════════════════════════════════════════════════════════════ */
function pesoParticipacion(code){
  if (salidoHoy.has(code)) return 0.001;
  const veces = CONTEOS[code] || 0;
  const faltan = Math.max(0, META_SORTEOS - veces);
  const holgura = CLASES_RESTANTES - faltan;
  if (faltan > 0 && holgura <= 0) return 6;   // urgente
  if (veces === 0) return 2;
  if (veces < META_SORTEOS) return 1;
  return 0.2;
}
function pesoRP(code){ return salidoHoy.has(code) ? 0.05 : 1; }

function pickWeighted(pool, k, pesoFn){
  const rem = [...pool], out = [];
  const n = Math.min(k, rem.length);   // fijo: antes se recalculaba al achicarse rem y nunca pasaba de la mitad del grupo
  for (let i=0; i<n; i++){
    const w = rem.map(x => Math.max(0.02, pesoFn ? pesoFn(x.code) : 1));
    const tot = w.reduce((a,b)=>a+b,0);
    let r = Math.random()*tot, idx = 0;
    for (; idx < rem.length-1; idx++){ r -= w[idx]; if (r <= 0) break; }
    out.push(rem[idx]); rem.splice(idx,1);
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════
   REGISTRO DEL SORTEO → hoja "Sorteo_Estado" (para el traspaso a index.html)
   El conteo real de participación NO se toca aquí — lo actualiza el backend
   cuando la participación queda calificada en index.html. El +1 local es solo
   para que la ponderación no vuelva a subir a quien ya salió en esta clase.
   Trabajo Final NO registra nada: es solo visual/proyectado.
   ═══════════════════════════════════════════════════════════════════════ */
/* MODO ENSAYO — para probar antes de clase: el tablero gira y suena igual,
   pero no envía nada al Sheet, no llega al iPhone y no marca a nadie como
   "ya salió hoy". Siempre arranca APAGADO al abrir la página (a propósito:
   así nunca queda encendido por olvido en plena clase). */
let ENSAYO = false;
document.getElementById('ens').addEventListener('click', () => {
  if (S.busy) return;
  ENSAYO = !ENSAYO;
  const b = document.getElementById('ens');
  b.classList.toggle('on', ENSAYO); b.setAttribute('aria-pressed', String(ENSAYO));
  document.body.classList.toggle('ensayo', ENSAYO);
});

function registrarSorteo(st, grupo, modoDestino){
  if (ENSAYO) return;   // ensayo: nada al Sheet, nada a la cola del iPhone, nadie "ya salió"
  salidoHoy.add(st.code); guardarSalidos();
  CONTEOS[st.code] = (CONTEOS[st.code] || 0) + 1;
  // A la cola compartida: se reintenta hasta que el Sheet lo confirme.
  GEP.encolar({ action:'sorteo_registrar', codigo:st.code, alumno:st.name, grupo, modoDestino });
}

// Indicador discreto en el pie (lo ve el docente, no distrae al aula).
let pidiendoClave = false;
GEP.onSync(s => {
  const el = document.getElementById('sync'); if (!el) return;
  if (s.sinClave && !pidiendoClave){
    pidiendoClave = true;
    GEP.pedirClave('Para enviar los sorteos pendientes, ingresa la clave.').then(()=>{ pidiendoClave = false; });
  }
  el.textContent = s.pendientes ? s.pendientes + ' SIN ENVIAR' + (s.error ? ' · ERROR DEL SHEET' : '') : '';
});

/* ═══════════════════════════════════════════════════════════════════════
   ESTADO Y RENDER
   ═══════════════════════════════════════════════════════════════════════ */
let S = { mode:'part', nPart:2, nRP:2, rpPicks:{}, tfTab:'orden', tfGroup:null, tfOrden:null, busy:false, partPicks:null };
const app = document.getElementById('app');
const ctls = document.getElementById('ctls');
const TITULOS = { part:['PARTICIPACIÓN','Próximo en responder'], rp:['REPORTES PARCIALES','Sustentan el reporte'], tf:['TRABAJO FINAL','Sustentación final'] };

document.getElementById('mode-nav').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b || S.busy) return;
  S.mode = b.dataset.m;
  document.querySelectorAll('#mode-nav button').forEach(x=>x.classList.toggle('on', x===b));
  render();
});

function render(){
  if (!ALL.length){ return; }
  const [k, t] = TITULOS[S.mode];
  document.getElementById('kick').textContent = 'GEP201 · ' + k;
  document.getElementById('title').textContent = t;
  ({ part:renderPart, rp:renderRP, tf:renderTF })[S.mode]();
}
function refrescarListas(){ if (S.mode === 'part') drawRoster(S.partPicks ? S.partPicks.map(p=>p.code) : []); else if (S.mode === 'rp') drawGroups(); }
function lock(v){
  S.busy = v;
  document.querySelectorAll('#mode-nav button,.btn,.tfp button,.stepper button,#ens').forEach(b=>b.disabled=v);
}
function stepperHTML(label, id, val, fn){
  return `<div class="ctl"><label>${label}</label><div class="stepper"><button onclick="${fn}(-1)" aria-label="menos">−</button><span class="val" id="${id}">${val}</span><button onclick="${fn}(1)" aria-label="más">+</button></div></div>`;
}

/* ───────────────────────── PARTICIPACIÓN ───────────────────────── */
function renderPart(){
  const maxN = Math.min(4, ALL.length);
  if (S.nPart > maxN) S.nPart = maxN;
  ctls.innerHTML = stepperHTML('¿CUÁNTOS?', 'v-np', S.nPart, 'bumpPart') + `<button class="btn" id="go" onclick="sortearPart()">SORTEAR</button>`;
  app.innerHTML = `
    <div class="board"><div class="hdr"><span>N°</span><span>ALUMNO</span><span>GRUPO</span></div><div id="lines"></div></div>
    <div class="roster" id="roster"></div>`;
  drawLines(S.nPart, S.partPicks); drawRoster(S.partPicks ? S.partPicks.map(p=>p.code) : []);
}
window.bumpPart = (d)=>{
  if (S.busy) return;
  const maxN = Math.min(4, ALL.length);
  S.nPart = Math.max(1, Math.min(maxN, S.nPart + d));
  S.partPicks = null;
  document.getElementById('v-np').textContent = S.nPart;
  drawLines(S.nPart, null); drawRoster([]);
};
function drawLines(n, picked){
  const c = document.getElementById('lines'); if (!c) return;
  c.innerHTML = Array.from({length:n}, (_, i) => {
    const st = picked && picked[i];
    return `<div class="line ${st ? 'locked ' + GCLS[st.group] : ''}"><span class="idx">${String(i+1).padStart(2,'0')}</span>
      <div class="flaps" data-n="${W}" data-fw="54">${flapsHTML(W, st ? enTablero(st) : '')}</div>
      <div class="grp"><i class="lamp"></i><span class="gt">${st ? st.group : '— — —'}</span></div>
      <div class="full">${st ? nm(st).full : ''}</div></div>`;
  }).join('');
  ajustarTodo(c);
}
function drawRoster(pickedCodes){
  const c = document.getElementById('roster'); if (!c) return;
  c.innerHTML = Object.entries(GRUPOS).map(([g,ns])=>`
    <div class="col ${GCLS[g]}"><h3>${g}</h3>${ns.map(st=>`
      <div class="row ${pickedCodes.includes(st.code)?'picked':''}"><span>${nm(st).short}</span><span>${CONTEOS[st.code]||0}</span></div>`).join('')}</div>`).join('');
}
async function sortearPart(){
  if (S.busy) return; lock(true); Sonido.init();
  try{
    const picked = pickWeighted(ALL, S.nPart, pesoParticipacion);
    S.partPicks = null;
    drawLines(S.nPart, null); drawRoster([]);
    const lines = [...document.querySelectorAll('#lines .line')];
    await Promise.all(lines.map(async (line, i) => {
      await sleep(i * 700);                                   // cada línea arranca un poco después
      await revelar(line.querySelector('.flaps'), enTablero(picked[i]), { base: 600, cola: 2600 });
      await encender(line, picked[i].group);
      line.querySelector('.gt').textContent = picked[i].group;
      line.querySelector('.full').textContent = nm(picked[i]).full;
      registrarSorteo(picked[i], picked[i].group, 'Modo 1');
    }));
    S.partPicks = picked;
    drawRoster(picked.map(p=>p.code));
  } finally { lock(false); }
}

/* ───────────────────────── REPORTES PARCIALES ───────────────────────── */
function renderRP(){
  const minGrp = Math.min(...Object.values(GRUPOS).map(g=>g.length));
  if (S.nRP > minGrp) S.nRP = minGrp;
  ctls.innerHTML = stepperHTML('POR GRUPO', 'v-nr', S.nRP, 'bumpRP') + `<button class="btn" id="go-all" onclick="sortearRPTodos()">SORTEAR LOS ${Object.keys(GRUPOS).length} GRUPOS</button>`;
  app.innerHTML = `<div class="groups" id="groups"></div>`;
  drawGroups();
}
window.bumpRP = (d)=>{
  if (S.busy) return;
  const minGrp = Math.min(...Object.values(GRUPOS).map(g=>g.length));
  S.nRP = Math.max(1, Math.min(minGrp, S.nRP + d));
  S.rpPicks = {};
  document.getElementById('v-nr').textContent = S.nRP;
  drawGroups();
};
function drawGroups(){
  const c = document.getElementById('groups'); if (!c) return;
  c.innerHTML = Object.entries(GRUPOS).map(([g,ns])=>{
    const cls = GCLS[g], maxq = Math.min(S.nRP, ns.length);
    const pk = S.rpPicks[g], selCodes = (pk||[]).map(x=>x.code);
    const res = Array.from({length:maxq}, (_, i) => {
      const st = pk && pk[i];
      return `<div class="gline"><div class="flaps" data-n="${WF}" data-fw="34">${flapsHTML(WF, st ? up(nm(st).first) : '')}</div><div class="fam">${st ? up(nm(st).fam1) : ''}</div></div>`;
    }).join('');
    const rows = ns.map(st=>`<div class="mrow ${selCodes.includes(st.code)?'sel':''}" data-code="${st.code}"><span>${nm(st).short}</span><span>${CONTEOS[st.code]||0}</span></div>`).join('');
    return `<div class="gcard ${cls}" id="gc-${cls}">
      <div class="gh">GRUPO ${GNUM[g]}</div><div class="gsub">${ns.length} integrantes · sortear ${maxq}</div>
      <div class="gres" id="gres-${cls}">${res}</div>
      <div class="mlist">${rows}</div>
      <button class="btn ghost" onclick="sortearRP(['${esc(g)}'])">SORTEAR ${g}</button>
    </div>`;
  }).join('');
  ajustarTodo(c);
}
window.sortearRPTodos = ()=>window.sortearRP(Object.keys(GRUPOS));
window.sortearRP = async (groups)=>{
  if (S.busy) return; lock(true); Sonido.init();
  try{
    for (let i=0;i<groups.length;i++){ if (i) await sleep(300); await animRP(groups[i], groups.length > 1); }
  } finally { lock(false); }
};
async function animRP(g, rapido){
  const cls = GCLS[g], ns = GRUPOS[g], maxq = Math.min(S.nRP, ns.length);
  const picked = pickWeighted(ns, maxq, pesoRP);
  const box = document.getElementById('gres-'+cls);
  box.querySelectorAll('.flaps').forEach(f => { f.innerHTML = flapsHTML(WF, ''); });
  box.querySelectorAll('.fam').forEach(f => { f.textContent = ''; });
  const card = document.getElementById('gc-'+cls);
  card.querySelectorAll('.mrow').forEach(r=>r.classList.remove('sel'));
  const glines = [...box.querySelectorAll('.gline')];
  await Promise.all(glines.map(async (gl, i) => {
    await sleep(i * 450);
    await revelar(gl.querySelector('.flaps'), up(nm(picked[i]).first), rapido ? { base: 450, cola: 1200 } : { base: 600, cola: 1800 });
    const fam = gl.querySelector('.fam'); fam.textContent = up(nm(picked[i]).fam1);
    if (!REDUCIR) fam.animate([{ opacity:0 }, { opacity:1 }], { duration:260, easing:'ease' });
  }));
  S.rpPicks[g] = picked;
  picked.forEach(p=>registrarSorteo(p, g, 'Modo 2'));
  const codes = picked.map(p=>p.code);
  card.querySelectorAll('.mrow').forEach(r=>r.classList.toggle('sel', codes.includes(r.dataset.code)));
}

/* ───────────────────────── TRABAJO FINAL ───────────────────────── */
function renderTF(){
  ctls.innerHTML = `<button class="btn ghost ${S.tfTab==='orden'?'on':''}" onclick="tfTab('orden')">A · ORDEN</button>`
                 + `<button class="btn ghost ${S.tfTab==='roles'?'on':''}" onclick="tfTab('roles')">B · ROLES</button>`
                 + (S.tfTab==='orden' ? `<button class="btn" id="go-orden" onclick="sortearOrden()">SORTEAR ORDEN</button>` : '');
  S.tfTab==='orden' ? drawOrden() : renderTFRoles();
}
window.tfTab = (t)=>{ if (S.busy) return; S.tfTab = t; render(); };

let WG = 7;
function drawOrden(){
  const gs = Object.keys(GRUPOS); WG = Math.max(...gs.map(g=>g.length));
  app.innerHTML = `<div class="board"><div class="hdr"><span>N°</span><span>PRESENTA</span><span></span></div>
    ${gs.map((_,i)=>{ const g = S.tfOrden && S.tfOrden[i];
      return `<div class="line ${g ? 'locked ' + GCLS[g] : ''}" id="os-${i}"><span class="idx">${i+1}°</span>
        <div class="flaps" data-n="${WG}" data-fw="64">${flapsHTML(WG, g || '')}</div><div class="grp"><i class="lamp"></i></div></div>`; }).join('')}</div>`;
  ajustarTodo(app);
}
async function sortearOrden(){
  if (S.busy) return; lock(true); Sonido.init();
  try{
    const gs = Object.keys(GRUPOS), orden = shuffle(gs);
    S.tfOrden = null; drawOrden();
    await Promise.all(gs.map(async (_, i) => {
      const line = document.getElementById('os-'+i);
      await sleep(i * 650);
      await revelar(line.querySelector('.flaps'), orden[i], { base: 700, cola: 900 });
      await encender(line, orden[i]);
    }));
    S.tfOrden = orden;
  } finally { lock(false); }
}

function renderTFRoles(){
  const order = S.tfOrden || Object.keys(GRUPOS);
  const seq = S.tfOrden
    ? `<div class="seq">ORDEN · ${S.tfOrden.map((g,i)=>`<span>${i+1}° ${g}</span>`).join(' → ')}</div>`
    : `<div class="seq">Sortea el orden en A para fijar la secuencia (opcional).</div>`;
  app.innerHTML = `${seq}
    <div class="tfp">${order.map((g,i)=>`<button class="${S.tfGroup===g?'on':''}" onclick="tfPick('${esc(g)}')">${S.tfOrden?`<b>${i+1}°</b>`:''}${g}</button>`).join('')}</div>
    <div id="roles-area">${S.tfGroup ? rolesShell(S.tfGroup) : '<div class="ph">— selecciona un grupo —</div>'}</div>`;
  ajustarTodo(app);
}
window.tfPick = (g)=>{ if (S.busy) return; S.tfGroup = g; renderTFRoles(); };

function rolesShell(g){
  const nResp = Math.max(0, GRUPOS[g].length - 3);
  const fila = (id, rol, cls, sec) => `<div class="line" id="${id}"><span class="role ${cls}">${rol}</span>
    <div class="flaps" data-n="${W}" data-fw="46">${flapsHTML(W, '')}</div><div class="sec">${sec}</div></div>`;
  return `<div class="board"><div class="hdr"><span>ROL</span><span>ALUMNO</span><span>SECCIÓN</span></div>
    ${[0,1,2].map(i=>fila('pr-'+i, 'P'+(i+1), 'p', SECCIONES_TF[i]||'')).join('')}
    ${nResp ? '<div class="split"></div>' : ''}
    ${Array.from({length:nResp},(_,i)=>fila('rr-'+i, 'R'+(i+1), 'r', 'Preguntas del profesor')).join('')}
  </div>
  <button class="btn" style="margin-top:14px" id="go-roles" onclick="sortearRoles('${esc(g)}')">SORTEAR ROLES DE ${g}</button>`;
}
async function sortearRoles(g){
  if (S.busy) return; lock(true); Sonido.init();
  try{
    const ns = GRUPOS[g], nResp = Math.max(0, ns.length - 3);
    const ord = shuffle(ns), pres = ord.slice(0,3), resp = ord.slice(3);
    const rows = [
      ...[0,1,2].map(i=>({ el:document.getElementById('pr-'+i), st:pres[i] })),
      ...Array.from({length:nResp},(_,i)=>({ el:document.getElementById('rr-'+i), st:resp[i] })),
    ].filter(r=>r.el && r.st);
    rows.forEach(r => { r.el.classList.remove('locked'); r.el.querySelector('.flaps').innerHTML = flapsHTML(W, ''); });
    await Promise.all(rows.map(async (r, i) => {
      await sleep(i * 380);
      await revelar(r.el.querySelector('.flaps'), enTablero(r.st), { base: 500, cola: 1500 });
      await encender(r.el, g);
    }));
  } finally { lock(false); }
}

/* ═══════════════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════════════ */
cargarNomina();
</script>
