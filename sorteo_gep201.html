<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo GEP201</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0c1016; --bg2:#0f141c; --surface:#141b26; --surface2:#1a2331;
  --border:#25303f; --border-lit:#3a4a60;
  --accent:#5fd9cd; --accent-ink:#08201e;
  --amber:#f0b429;
  --text:#e9f0f7; --text-mid:#9fb0c4; --text-dim:#5b6a7e;
  --g1:#6b97d6; --g2:#5fb98a; --g3:#b579a8;
  --g1-soft:rgba(107,151,214,.10); --g2-soft:rgba(95,185,138,.10); --g3-soft:rgba(181,121,168,.10);
  --danger:#d06a6a;
  --radius:6px; --maxw:1040px;
  --ease:cubic-bezier(.16,1,.3,1);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}

html,body{min-height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--mono); font-size:15px; line-height:1.55;
  padding:34px 22px 130px;
  display:flex; flex-direction:column; align-items:center;
  position:relative; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:46px 46px;
}
.wrap{width:100%; max-width:var(--maxw); position:relative; z-index:1}

/* ---------- HEADER ---------- */
header{width:100%; max-width:var(--maxw); position:relative; z-index:1;
  padding:6px 0 20px; border-bottom:1px solid var(--border)}
.eyebrow{font-size:10.5px; letter-spacing:.28em; text-transform:uppercase; color:var(--accent); margin-bottom:12px}
h1{font-weight:600; font-size:clamp(28px,4.6vw,46px); letter-spacing:.02em; text-transform:uppercase; line-height:1.05}
h1 .mark{color:var(--accent)}
.sub{font-size:12px; color:var(--text-dim); margin-top:11px; letter-spacing:.06em; text-transform:uppercase}

/* ---------- SELECTOR DE TIPO ---------- */
.mode-nav{width:100%; max-width:var(--maxw); display:flex; position:relative; z-index:1;
  border-bottom:1px solid var(--border); margin-bottom:34px; overflow-x:auto; scrollbar-width:none}
.mode-nav::-webkit-scrollbar{display:none}
.mode-nav button{
  font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  padding:16px 22px; background:none; border:none; border-bottom:2px solid transparent;
  color:var(--text-dim); cursor:pointer; white-space:nowrap; transition:color .18s, border-color .18s;
}
.mode-nav button:hover{color:var(--text-mid)}
.mode-nav button.on{color:var(--accent); border-bottom-color:var(--accent)}

/* ---------- BOTONES ---------- */
.btn{
  font-family:var(--mono); font-size:12px; font-weight:500; letter-spacing:.14em; text-transform:uppercase;
  padding:14px 28px; border-radius:var(--radius); cursor:pointer;
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  transition:transform .12s var(--ease), box-shadow .2s, opacity .15s;
}
.btn:hover{transform:translateY(-1px); box-shadow:0 6px 22px -8px var(--accent)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.3; cursor:not-allowed; transform:none; box-shadow:none}
.btn.ghost{background:transparent; color:var(--accent); border-color:var(--border-lit)}
.btn.ghost:hover{border-color:var(--accent); background:rgba(95,217,205,.05)}
.btn.sm{font-size:10.5px; padding:10px 16px; letter-spacing:.1em}

.crumb{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px}
.screen-title{font-weight:600; font-size:clamp(19px,2.7vw,25px); text-transform:uppercase; letter-spacing:.02em; margin-bottom:22px}

/* ---------- CONTROLES ---------- */
.controls-row{display:flex; align-items:center; gap:26px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 22px; margin-bottom:26px}
.ctl{display:flex; flex-direction:column; gap:9px}
.ctl-label{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--text-mid)}
.stepper{display:flex; align-items:center; gap:14px}
.stepper button{width:36px; height:36px; border-radius:var(--radius); border:1px solid var(--border);
  background:var(--bg2); color:var(--text); font-size:20px; cursor:pointer; line-height:1;
  display:flex; align-items:center; justify-content:center; transition:border-color .15s}
.stepper button:hover{border-color:var(--accent)}
.stepper .val{font-weight:600; font-size:26px; color:var(--accent); min-width:34px; text-align:center}
.controls-row .btn{margin-left:auto}

/* ---------- PARTICIPACIÓN: reveal ---------- */
.stage{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:44px 34px 40px; margin-bottom:24px; position:relative; overflow:hidden}
.stage-label{font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--text-dim);
  position:absolute; top:16px; left:20px}
.slot-col{display:flex; flex-direction:column; gap:14px; max-width:560px; margin:14px auto 0}
.slot{height:74px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg2);
  position:relative; overflow:hidden; display:flex; align-items:center; padding:0 24px;
  transition:border-color .3s, box-shadow .3s}
.slot .slot-text{font-family:var(--mono); font-size:25px; font-weight:600; letter-spacing:.03em;
  text-transform:uppercase; color:var(--text-mid); white-space:nowrap}
.slot.spin .slot-text{animation:cyc .09s linear infinite}
@keyframes cyc{0%{opacity:.3;transform:translateY(-3px)}50%{opacity:.85;transform:translateY(0)}100%{opacity:.3;transform:translateY(3px)}}
.slot.locked{border-color:var(--accent); background:var(--surface2);
  box-shadow:inset 0 0 0 1px var(--accent), 0 0 26px -8px var(--accent)}
.slot.locked .slot-text{color:var(--accent); animation:none}
.slot.locked .slot-text::before{content:'[ '; color:var(--accent); opacity:.55}
.slot.locked .slot-text::after{content:' ]'; color:var(--accent); opacity:.55}
.term{font-family:var(--mono); font-size:12.5px; color:var(--accent); letter-spacing:.05em;
  min-height:18px; margin:18px auto 0; max-width:560px; text-align:left}

/* ---------- PARTICIPACIÓN: lista de la clase ---------- */
.class-roster{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
@media(max-width:820px){.class-roster{grid-template-columns:1fr}}
.cr-col{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden}
.cr-col.g1{border-top:3px solid var(--g1)} .cr-col.g2{border-top:3px solid var(--g2)} .cr-col.g3{border-top:3px solid var(--g3)}
.cr-head{padding:13px 16px 10px; border-bottom:1px solid var(--border); font-size:11px;
  letter-spacing:.24em; text-transform:uppercase}
.cr-col.g1 .cr-head{color:var(--g1)} .cr-col.g2 .cr-head{color:var(--g2)} .cr-col.g3 .cr-head{color:var(--g3)}
.cr-list{padding:8px 0}
.cr-row{display:flex; align-items:center; gap:9px; padding:8px 16px; font-size:12px; color:var(--text-mid);
  border-left:2px solid transparent; transition:background .2s, color .2s, border-color .2s}
.cr-row .cr-dot{width:5px; height:5px; border-radius:50%; background:var(--border-lit); flex-shrink:0}
.cr-row .cr-n{margin-left:auto; font-size:10px; color:var(--text-dim)}
.cr-row.picked{color:var(--text); background:rgba(95,217,205,.07); border-left-color:var(--accent)}
.cr-row.picked .cr-dot{background:var(--accent)}
.cr-row.picked .cr-n{color:var(--accent)}

/* ---------- REPORTES PARCIALES ---------- */
.groups{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
@media(max-width:900px){.groups{grid-template-columns:1fr}}
.gcard{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
  display:flex; flex-direction:column}
.gcard.g1{border-top:3px solid var(--g1)} .gcard.g2{border-top:3px solid var(--g2)} .gcard.g3{border-top:3px solid var(--g3)}
.gcard-head{padding:15px 18px 13px; border-bottom:1px solid var(--border)}
.gtag{font-size:9px; letter-spacing:.3em; text-transform:uppercase; margin-bottom:5px}
.g1 .gtag{color:var(--g1)} .g2 .gtag{color:var(--g2)} .g3 .gtag{color:var(--g3)}
.gname{font-weight:600; font-size:16px; text-transform:uppercase; letter-spacing:.02em}
.gcount{font-size:10px; color:var(--text-dim); margin-top:3px}

.gresult{padding:14px 18px 16px; border-bottom:1px solid var(--border); background:var(--bg2)}
.gresult-label{font-size:9px; letter-spacing:.24em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px}
.gres-slots{display:flex; flex-direction:column; gap:8px}
.gres-slot{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);
  padding:10px 14px; overflow:hidden; transition:border-color .3s, box-shadow .3s}
.gres-first{display:block; font-size:22px; font-weight:600; text-transform:uppercase; letter-spacing:.02em;
  color:var(--text-mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.gres-last{display:block; font-size:11px; color:var(--text-dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.gres-slot.spin .gres-first{animation:cyc .09s linear infinite}
.gcard.g1 .gres-slot.locked{border-color:var(--g1); box-shadow:0 0 18px -9px var(--g1)}
.gcard.g2 .gres-slot.locked{border-color:var(--g2); box-shadow:0 0 18px -9px var(--g2)}
.gcard.g3 .gres-slot.locked{border-color:var(--g3); box-shadow:0 0 18px -9px var(--g3)}
.gcard.g1 .gres-slot.locked .gres-first{color:var(--g1)}
.gcard.g2 .gres-slot.locked .gres-first{color:var(--g2)}
.gcard.g3 .gres-slot.locked .gres-first{color:var(--g3)}
.gres-empty{font-size:10px; color:var(--text-dim); font-style:italic}

.mlist{padding:9px 0; flex:1}
.mrow{padding:6px 18px; font-size:11px; color:var(--text-dim); display:flex; align-items:center; gap:8px;
  border-left:2px solid transparent; transition:all .2s}
.mrow .mdot{width:5px; height:5px; border-radius:50%; background:var(--border-lit); flex-shrink:0}
.mrow .mn{margin-left:auto; font-size:10px; color:var(--text-dim)}
.gcard.g1 .mrow.sel{background:var(--g1-soft); border-left-color:var(--g1); color:var(--text)}
.gcard.g2 .mrow.sel{background:var(--g2-soft); border-left-color:var(--g2); color:var(--text)}
.gcard.g3 .mrow.sel{background:var(--g3-soft); border-left-color:var(--g3); color:var(--text)}
.gcard.g1 .mrow.sel .mdot{background:var(--g1)}
.gcard.g2 .mrow.sel .mdot{background:var(--g2)}
.gcard.g3 .mrow.sel .mdot{background:var(--g3)}
.gcard .btn{margin:0 18px 16px; display:block}

/* ---------- TRABAJO FINAL ---------- */
.subtabs{display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap}
.subtab{font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:11px 18px;
  border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);
  color:var(--text-mid); cursor:pointer; transition:all .18s}
.subtab:hover{border-color:var(--border-lit)}
.subtab.on{border-color:var(--accent); color:var(--accent); background:var(--surface2)}

.orden-slots{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px}
@media(max-width:660px){.orden-slots{grid-template-columns:1fr}}
.orden-wrap{display:flex; flex-direction:column; gap:8px}
.orden-pos{font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--text-dim)}
.orden-slot{height:86px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);
  display:flex; align-items:center; padding:0 22px; overflow:hidden}
.orden-slot .slot-text{font-weight:600; font-size:20px; text-transform:uppercase; letter-spacing:.02em; color:var(--text-mid)}
.orden-slot.spin .slot-text{animation:cyc .09s linear infinite}
.orden-slot.locked.g1{border-color:var(--g1); box-shadow:0 0 24px -8px var(--g1)}
.orden-slot.locked.g2{border-color:var(--g2); box-shadow:0 0 24px -8px var(--g2)}
.orden-slot.locked.g3{border-color:var(--g3); box-shadow:0 0 24px -8px var(--g3)}
.orden-slot.locked.g1 .slot-text{color:var(--g1)}
.orden-slot.locked.g2 .slot-text{color:var(--g2)}
.orden-slot.locked.g3 .slot-text{color:var(--g3)}

.tf-seq{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:16px}
.tf-seq span.g1{color:var(--g1)} .tf-seq span.g2{color:var(--g2)} .tf-seq span.g3{color:var(--g3)}
.tf-seq .arr{color:var(--text-dim)}
.tf-gbtn b{color:var(--text-dim); font-weight:600; margin-right:2px}
.tf-gbtn.on b{color:inherit}
.tf-group-pick{display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap}
.tf-gbtn{font-size:12px; letter-spacing:.06em; padding:12px 20px; border:1px solid var(--border);
  border-radius:var(--radius); background:var(--surface); color:var(--text-mid); cursor:pointer;
  text-transform:uppercase; transition:all .18s}
.tf-gbtn.g1.on{border-color:var(--g1); color:var(--g1); background:var(--g1-soft)}
.tf-gbtn.g2.on{border-color:var(--g2); color:var(--g2); background:var(--g2-soft)}
.tf-gbtn.g3.on{border-color:var(--g3); color:var(--g3); background:var(--g3-soft)}

.roles-out{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:6px}
@media(max-width:740px){.roles-out{grid-template-columns:1fr}}
.roles-col h4{font-size:10px; letter-spacing:.2em; text-transform:uppercase; margin-bottom:12px}
.roles-col.pres h4{color:var(--accent)}
.roles-col.resp h4{color:var(--amber)}
.role-row{display:flex; align-items:center; gap:14px; padding:14px 18px; margin-bottom:8px;
  border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); overflow:hidden;
  transition:border-color .3s, box-shadow .3s}
.role-badge{font-size:12px; font-weight:600; width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  border:1px solid var(--border-lit); color:var(--text-mid)}
.role-name{font-family:var(--mono); font-size:20px; font-weight:600; text-transform:uppercase;
  letter-spacing:.02em; color:var(--text-mid); white-space:nowrap}
.role-row.spin .role-name{animation:cyc .09s linear infinite}
.role-sec{margin-left:auto; font-size:10px; color:var(--text-dim); text-align:right; line-height:1.3; max-width:150px}
.roles-col.pres .role-row.locked{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent), 0 0 22px -10px var(--accent)}
.roles-col.pres .role-row.locked .role-badge{border-color:var(--accent); color:var(--accent)}
.roles-col.pres .role-row.locked .role-name{color:var(--accent)}
.roles-col.pres .role-row.locked .role-name::before{content:'[ '; opacity:.55}
.roles-col.pres .role-row.locked .role-name::after{content:' ]'; opacity:.55}
.roles-col.resp .role-row.locked{border-color:var(--amber); box-shadow:inset 0 0 0 1px var(--amber), 0 0 22px -10px var(--amber)}
.roles-col.resp .role-row.locked .role-badge{border-color:var(--amber); color:var(--amber)}
.roles-col.resp .role-row.locked .role-name{color:var(--amber)}
.roles-col.resp .role-row.locked .role-name::before{content:'[ '; opacity:.55}
.roles-col.resp .role-row.locked .role-name::after{content:' ]'; opacity:.55}

.ph{font-size:11px; color:var(--text-dim); font-style:italic}
.load-err{padding:40px; text-align:center; color:var(--danger); font-size:13px; line-height:1.6}
.flash{position:fixed; inset:0; background:var(--accent); opacity:0; pointer-events:none; z-index:80; transition:opacity .09s}
.flash.on{opacity:.05}
footer{margin-top:54px; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-dim); text-align:center; position:relative; z-index:1}
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<header>
  <div class="eyebrow">GEP201 · Gestión Financiera del Estado · 2026-2</div>
  <h1>Sorteo <span class="mark">GEP201</span></h1>
  <div class="sub" id="sub"></div>
</header>

<nav class="mode-nav" id="mode-nav">
  <button data-m="part" class="on">Participación</button>
  <button data-m="rp">Reportes Parciales</button>
  <button data-m="tf">Trabajo Final</button>
</nav>

<div class="wrap" id="app"><div class="ph" style="padding:40px;text-align:center">Cargando lista de alumnos…</div></div>

<footer>GEP201 · FGAD · PUCP</footer>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   BACKEND — mismo Apps Script que usa index.html (proyecto GEP201_API)
   ═══════════════════════════════════════════════════════════════════════ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzSur7nSfzlTjhTF286vnu34wrY5-U1sYkgztpGRk0i8o9Mh9yGNCrjgqH5_p9qqOwMWA/exec';

// Clases que quedan en el semestre (incluida hoy). Actualizar cada semana.
// Solo afecta la urgencia de la ponderación en Participación.
const CLASES_RESTANTES = 12;
const META_SORTEOS = 2;   // veces que debería tocarle a cada alumno en el semestre (solo Participación)

// Fecha de la bajada. Deja null para que sea automática; o pon 'DD de mes de YYYY'.
const FECHA_MANUAL = null;

/* ═══════════════════════════════════════════════════════════════════════
   DATOS — se llenan desde la hoja "Nomina" (action=nomina) al cargar.
   Para un semestre futuro: editar solo esa hoja, no este archivo.
   ═══════════════════════════════════════════════════════════════════════ */
let GRUPOS = {};       // { "GRUPO 1": [ {code,name,nombres,apellidos,group}, ... ] }
let ALL = [];          // lista plana de todos los alumnos
let GCLS = {};         // "GRUPO 1" -> "g1"  (asignado por orden de aparición)
let GNUM = {};         // "GRUPO 1" -> "01"
let CONTEOS = {};      // code -> veces participado en el semestre (desde el backend)
const salidoHoy = new Set();  // codes ya sorteados en esta sesión de clase

const SECCIONES_TF = ["Sección 1 · Diagnóstico","Sección 2 · Modelos MC/ME","Sección 3 · Teoría de Cambio"];

/* ---------- helpers ---------- */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const rnd = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function flash(){ const f=document.getElementById('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),110); }

// Descompone el nombre. Preferir las columnas Nombres/Apellidos de la hoja
// (corte limpio); si no llegan, partir el nombre completo por el primer espacio.
function nm(st){
  let given, family;
  if (st.nombres && st.apellidos){ given = st.nombres; family = st.apellidos; }
  else { const p = String(st.name||'').split(' '); given = p[0]||''; family = p.slice(1).join(' '); }
  const first = given.split(' ')[0];                                           // primer nombre
  const rest  = (given.split(' ').slice(1).join(' ') + ' ' + family).trim();   // 2do nombre + apellidos
  const short = (first + ' ' + (family.split(' ')[0] || given.split(' ')[1] || '')).trim();
  return { given, family, first, rest, short };
}
const shortUp = st => nm(st).short.toUpperCase();

(function setFecha(){
  const el = document.getElementById('sub');
  if (FECHA_MANUAL) { el.textContent = FECHA_MANUAL; return; }
  const m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const d=new Date();
  el.textContent = `${d.getDate()} de ${m[d.getMonth()]} de ${d.getFullYear()}`;
})();

/* ═══════════════════════════════════════════════════════════════════════
   CARGA DE NÓMINA Y CONTEOS
   ═══════════════════════════════════════════════════════════════════════ */
async function cargarNomina(){
  try{
    const res = await fetch(SCRIPT_URL + '?action=nomina');
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.msg || 'respuesta inválida');
    GRUPOS = {};
    data.alumnos.forEach(a=>{
      const g = String(a.grupo).trim();
      (GRUPOS[g] = GRUPOS[g] || []).push({
        code: String(a.codigo), name: a.nombre,
        nombres: a.nombres || '', apellidos: a.apellidos || '', group: g
      });
    });
    ALL = Object.values(GRUPOS).flat();
    // Color y número por el dígito de "GRUPO N" (GRUPO 1 = azul, 2 = verde, 3 = morado);
    // si el nombre no trae número, se asigna por orden de aparición.
    Object.keys(GRUPOS).forEach((g,i)=>{
      const num = (String(g).match(/\d+/) || [])[0];
      const n = num ? parseInt(num,10) : i+1;
      GCLS[g] = 'g' + (((n-1) % 3) + 1);
      GNUM[g] = String(n).padStart(2,'0');
    });
    render();
    cargarConteos();
  }catch(e){
    console.error('No se pudo cargar la nómina', e);
    document.getElementById('app').innerHTML =
      '<div class="load-err">No se pudo cargar la lista de alumnos.<br>Revisa tu conexión e intenta recargar la página.</div>';
  }
}
async function cargarConteos(){
  try{
    const res = await fetch(SCRIPT_URL + '?action=sorteo_conteos');
    const data = await res.json();
    if (data.status === 'ok'){ CONTEOS = data.conteos || {}; render(); }
  }catch(e){ /* silencioso: si falla, los contadores quedan en 0 hasta la próxima consulta */ }
}

/* ═══════════════════════════════════════════════════════════════════════
   PONDERACIÓN
   Participación: sesgo hacia quien menos ha salido, con urgencia si se
   acaban las clases para llegar a la meta, y piso bajo (no cero) para
   quien ya cumplió — así nadie se siente "a salvo".
   RP: casi uniforme — el sorteo asigna quién sustenta, no reparte cobertura.
   ═══════════════════════════════════════════════════════════════════════ */
function pesoParticipacion(code){
  if (salidoHoy.has(code)) return 0.001;
  const veces = CONTEOS[code] || 0;
  const faltan = Math.max(0, META_SORTEOS - veces);
  const holgura = CLASES_RESTANTES - faltan;
  if (faltan > 0 && holgura <= 0) return 6;   // urgente
  if (veces === 0) return 2;
  if (veces < META_SORTEOS) return 1;
  return 0.2;
}
function pesoRP(code){ return salidoHoy.has(code) ? 0.05 : 1; }

function pickWeighted(pool, k, pesoFn){
  const rem = [...pool], out = [];
  for (let i=0; i<Math.min(k, rem.length); i++){
    const w = rem.map(x => Math.max(0.02, pesoFn ? pesoFn(x.code) : 1));
    const tot = w.reduce((a,b)=>a+b,0);
    let r = Math.random()*tot, idx = 0;
    for (; idx < rem.length-1; idx++){ r -= w[idx]; if (r <= 0) break; }
    out.push(rem[idx]); rem.splice(idx,1);
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════
   REGISTRO DEL SORTEO → hoja "Sorteo_Estado" (para el traspaso a index.html)
   El conteo real de participación NO se toca aquí — lo actualiza el backend
   cuando la participación queda calificada en index.html. El +1 local es solo
   para que la ponderación no vuelva a subir a quien ya salió en esta clase.
   Trabajo Final NO registra nada: es solo visual/proyectado.
   ═══════════════════════════════════════════════════════════════════════ */
function registrarSorteo(st, grupo, modoDestino){
  salidoHoy.add(st.code);
  CONTEOS[st.code] = (CONTEOS[st.code] || 0) + 1;
  const payload = { action:'sorteo_registrar', codigo:st.code, alumno:st.name, grupo, modoDestino };
  fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })
    .catch(e => console.warn('No se pudo registrar el sorteo en el backend', e));
}

/* ═══════════════════════════════════════════════════════════════════════
   ESTADO Y RENDER
   ═══════════════════════════════════════════════════════════════════════ */
let S = { mode:'part', nPart:2, nRP:2, rpPicks:{}, tfTab:'orden', tfGroup:null, tfOrden:null, busy:false };
const app = document.getElementById('app');

document.getElementById('mode-nav').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b || S.busy) return;
  S.mode = b.dataset.m;
  document.querySelectorAll('#mode-nav button').forEach(x=>x.classList.toggle('on', x===b));
  render();
});

function render(){
  if (!ALL.length){ return; }
  ({ part:renderPart, rp:renderRP, tf:renderTF })[S.mode]();
}
function lock(v){
  S.busy = v;
  document.querySelectorAll('#mode-nav button,.btn,.subtab,.tf-gbtn').forEach(b=>b.disabled=v);
}

/* ───────────────────────── PARTICIPACIÓN ───────────────────────── */
function renderPart(){
  const maxN = Math.min(4, ALL.length);
  if (S.nPart > maxN) S.nPart = maxN;
  app.innerHTML = `
    <div class="crumb">Participación · toda la clase</div>
    <div class="screen-title">¿Quién responde?</div>
    <div class="controls-row">
      <div class="ctl"><span class="ctl-label">¿Cuántos?</span>
        <div class="stepper"><button onclick="bumpPart(-1)">−</button><span class="val" id="v-np">${S.nPart}</span><button onclick="bumpPart(1)">+</button></div>
      </div>
      <button class="btn" id="go" onclick="sortearPart()">↯ Sortear</button>
    </div>
    <div class="stage"><span class="stage-label">Seleccionados</span>
      <div class="slot-col" id="slots"></div>
      <div class="term" id="term"></div>
    </div>
    <div class="class-roster" id="roster"></div>`;
  drawSlots(S.nPart, null); drawRoster([]);
}
window.bumpPart = (d)=>{
  const maxN = Math.min(4, ALL.length);
  S.nPart = Math.max(1, Math.min(maxN, S.nPart + d));
  document.getElementById('v-np').textContent = S.nPart;
  drawSlots(S.nPart, null);
};
function drawSlots(n, picked){
  const c = document.getElementById('slots'); if (!c) return; c.innerHTML = '';
  for (let i=0;i<n;i++){
    const s = document.createElement('div'); s.className = 'slot';
    s.innerHTML = `<span class="slot-text">${picked && picked[i] ? shortUp(picked[i]) : '—'}</span>`;
    c.appendChild(s);
  }
}
function drawRoster(pickedCodes){
  const c = document.getElementById('roster'); if (!c) return;
  c.innerHTML = Object.entries(GRUPOS).map(([g,ns])=>`
    <div class="cr-col ${GCLS[g]}">
      <div class="cr-head">${g}</div>
      <div class="cr-list">${ns.map(st=>`
        <div class="cr-row ${pickedCodes.includes(st.code)?'picked':''}">
          <span class="cr-dot"></span>${nm(st).short}
          <span class="cr-n">${CONTEOS[st.code]||0}</span>
        </div>`).join('')}</div>
    </div>`).join('');
}
async function sortearPart(){
  if (S.busy) return; lock(true);
  const term = document.getElementById('term');
  const picked = pickWeighted(ALL, S.nPart, pesoParticipacion);
  drawSlots(S.nPart, null);
  const slots = [...document.querySelectorAll('#slots .slot')];
  slots.forEach(s=>s.classList.add('spin'));
  term.textContent = '» sorteando…';
  const sp = setInterval(()=>slots.forEach(s=>{ if (s.classList.contains('spin')) s.querySelector('.slot-text').textContent = shortUp(rnd(ALL)); }), 70);
  await sleep(1500); clearInterval(sp);
  for (let i=0;i<slots.length;i++){
    await sleep(360);
    slots[i].classList.remove('spin'); slots[i].classList.add('locked');
    slots[i].querySelector('.slot-text').textContent = shortUp(picked[i]);
    registrarSorteo(picked[i], picked[i].group, 'Modo 1');
    const n = nm(picked[i]);
    term.textContent = '» seleccionado · ' + n.given + ' ' + n.family;
    flash(); await sleep(160);
  }
  drawRoster(picked.map(p=>p.code));
  lock(false);
}

/* ───────────────────────── REPORTES PARCIALES ───────────────────────── */
function renderRP(){
  const minGrp = Math.min(...Object.values(GRUPOS).map(g=>g.length));
  if (S.nRP > minGrp) S.nRP = minGrp;
  app.innerHTML = `
    <div class="crumb">Reportes Parciales · por grupo</div>
    <div class="screen-title">Integrantes que sustentan</div>
    <div class="controls-row">
      <div class="ctl"><span class="ctl-label">¿Cuántos por grupo?</span>
        <div class="stepper"><button onclick="bumpRP(-1)">−</button><span class="val" id="v-nr">${S.nRP}</span><button onclick="bumpRP(1)">+</button></div>
      </div>
      <button class="btn" id="go-all" onclick="sortearRPTodos()">↯ Sortear los ${Object.keys(GRUPOS).length} grupos</button>
    </div>
    <div class="groups" id="groups"></div>`;
  drawGroups();
}
window.bumpRP = (d)=>{
  const minGrp = Math.min(...Object.values(GRUPOS).map(g=>g.length));
  S.nRP = Math.max(1, Math.min(minGrp, S.nRP + d));
  S.rpPicks = {};
  document.getElementById('v-nr').textContent = S.nRP;
  drawGroups();
};
function drawGroups(){
  const c = document.getElementById('groups'); if (!c) return;
  c.innerHTML = Object.entries(GRUPOS).map(([g,ns])=>{
    const cls = GCLS[g], maxq = Math.min(S.nRP, ns.length);
    const pk = S.rpPicks[g], selCodes = (pk||[]).map(x=>x.code);
    const resSlots = pk
      ? pk.map(p=>`<div class="gres-slot locked"><span class="gres-first">${nm(p).first}</span><span class="gres-last">${nm(p).rest}</span></div>`).join('')
      : `<div class="gres-empty">— sin sorteo aún —</div>`;
    const rows = ns.map(st=>`<div class="mrow ${selCodes.includes(st.code)?'sel':''}"><span class="mdot"></span>${nm(st).short}<span class="mn">${CONTEOS[st.code]||0}</span></div>`).join('');
    return `<div class="gcard ${cls}" id="gc-${cls}">
      <div class="gcard-head">
        <div class="gtag">Grupo ${GNUM[g]}</div><div class="gname">${g}</div>
        <div class="gcount">${ns.length} integrantes · sortear ${maxq}</div>
      </div>
      <div class="gresult">
        <div class="gresult-label">Resultado</div>
        <div class="gres-slots" id="gres-${cls}">${resSlots}</div>
      </div>
      <div class="mlist">${rows}</div>
      <button class="btn ghost sm" onclick="sortearRP(['${g.replace(/'/g,"\\'")}'])">↯ Sortear ${g}</button>
    </div>`;
  }).join('');
}
window.sortearRPTodos = ()=>window.sortearRP(Object.keys(GRUPOS));
window.sortearRP = async (groups)=>{
  if (S.busy) return; lock(true);
  for (let i=0;i<groups.length;i++){ if (i) await sleep(340); await animRP(groups[i], groups.length>1 ? 1100 : 1500); }
  lock(false);
};
async function animRP(g, dur){
  const cls = GCLS[g], ns = GRUPOS[g], maxq = Math.min(S.nRP, ns.length);
  const picked = pickWeighted(ns, maxq, pesoRP);
  const box = document.getElementById('gres-'+cls); box.innerHTML = '';
  const slots = [];
  for (let i=0;i<maxq;i++){
    const s = document.createElement('div'); s.className = 'gres-slot spin';
    s.innerHTML = `<span class="gres-first">${nm(rnd(ns)).first}</span><span class="gres-last"></span>`;
    box.appendChild(s); slots.push(s);
  }
  const sp = setInterval(()=>slots.forEach(s=>{ if (s.classList.contains('spin')) s.querySelector('.gres-first').textContent = nm(rnd(ns)).first; }), 70);
  await sleep(dur); clearInterval(sp);
  for (let i=0;i<slots.length;i++){
    await sleep(260);
    slots[i].classList.remove('spin'); slots[i].classList.add('locked');
    slots[i].querySelector('.gres-first').textContent = nm(picked[i]).first;
    slots[i].querySelector('.gres-last').textContent = nm(picked[i]).rest;
    flash(); await sleep(150);
  }
  S.rpPicks[g] = picked;
  picked.forEach(p=>registrarSorteo(p, g, 'Modo 2'));
  const card = document.getElementById('gc-'+cls);
  const shorts = picked.map(p=>nm(p).short);
  card.querySelectorAll('.mrow').forEach(r=>{
    r.classList.toggle('sel', shorts.some(s=>r.textContent.trim().startsWith(s)));
  });
}

/* ───────────────────────── TRABAJO FINAL ───────────────────────── */
function renderTF(){
  app.innerHTML = `
    <div class="crumb">Trabajo Final</div>
    <div class="screen-title">Sustentación</div>
    <div class="subtabs">
      <div class="subtab ${S.tfTab==='orden'?'on':''}" onclick="tfTab('orden')">A · Orden de los grupos</div>
      <div class="subtab ${S.tfTab==='roles'?'on':''}" onclick="tfTab('roles')">B · Roles por grupo</div>
    </div>
    <div id="tf-body"></div>`;
  S.tfTab==='orden' ? renderTFOrden() : renderTFRoles();
}
window.tfTab = (t)=>{ if (S.busy) return; S.tfTab = t; render(); };

function renderTFOrden(){
  const gs = Object.keys(GRUPOS);
  document.getElementById('tf-body').innerHTML = `
    <div class="orden-slots">
      ${gs.map((_,i)=>`<div class="orden-wrap"><div class="orden-pos">${i+1}° en presentar</div>
        <div class="orden-slot" id="os-${i}"><span class="slot-text">${S.tfOrden ? S.tfOrden[i] : '—'}</span></div></div>`).join('')}
    </div>
    <button class="btn" id="go-orden" onclick="sortearOrden()">↯ Sortear orden</button>`;
  if (S.tfOrden) [0,1,2].forEach(i=>{
    const el = document.getElementById('os-'+i); if (el) el.className = 'orden-slot locked ' + GCLS[S.tfOrden[i]];
  });
}
async function sortearOrden(){
  if (S.busy) return; lock(true);
  const gs = Object.keys(GRUPOS), orden = shuffle(gs);
  const slots = gs.map((_,i)=>document.getElementById('os-'+i));
  slots.forEach(s=>s.className='orden-slot spin');
  const sp = setInterval(()=>slots.forEach(s=>{ if (s.classList.contains('spin')) s.querySelector('.slot-text').textContent = rnd(gs); }), 70);
  await sleep(1600); clearInterval(sp);
  for (let i=0;i<slots.length;i++){
    await sleep(380);
    slots[i].className = 'orden-slot locked ' + GCLS[orden[i]];
    slots[i].querySelector('.slot-text').textContent = orden[i];
    flash(); await sleep(180);
  }
  S.tfOrden = orden;
  lock(false);
}

function renderTFRoles(){
  const order = S.tfOrden || Object.keys(GRUPOS);
  const seqLine = S.tfOrden
    ? `<div class="tf-seq">Orden de presentación &nbsp;·&nbsp; ${S.tfOrden.map((g,i)=>`<span class="${GCLS[g]}">${i+1}° ${g}</span>`).join(' <span class="arr">→</span> ')}</div>`
    : `<div class="tf-seq ph">Sortea el orden en la pestaña A para fijar la secuencia (opcional).</div>`;
  document.getElementById('tf-body').innerHTML = `
    ${seqLine}
    <div class="tf-group-pick">
      ${order.map((g,i)=>`<button class="tf-gbtn ${GCLS[g]} ${S.tfGroup===g?'on':''}" onclick="tfPick('${g.replace(/'/g,"\\'")}')">${S.tfOrden?`<b>${i+1}°</b> `:''}${g}</button>`).join('')}
    </div>
    <div id="roles-area">${S.tfGroup ? rolesShell(S.tfGroup) : '<div class="ph">— selecciona un grupo —</div>'}</div>`;
}
window.tfPick = (g)=>{ if (S.busy) return; S.tfGroup = g; renderTFRoles(); };

function rolesShell(g){
  const nResp = Math.max(0, GRUPOS[g].length - 3);
  const pres = [0,1,2].map(i=>`<div class="role-row" id="pr-${i}"><span class="role-badge">P${i+1}</span>
    <span class="role-name">—</span><span class="role-sec">${SECCIONES_TF[i]||''}</span></div>`).join('');
  const resp = Array.from({length:nResp},(_,i)=>`<div class="role-row" id="rr-${i}"><span class="role-badge">R${i+1}</span>
    <span class="role-name">—</span><span class="role-sec">Preguntas del profesor</span></div>`).join('');
  return `<div class="roles-out">
      <div class="roles-col pres"><h4>Presentadores</h4>${pres}</div>
      <div class="roles-col resp"><h4>Respondedores</h4>${resp}</div>
    </div>
    <button class="btn" style="margin-top:20px" id="go-roles" onclick="sortearRoles('${g.replace(/'/g,"\\'")}')">↯ Sortear roles de ${g}</button>`;
}
async function sortearRoles(g){
  if (S.busy) return; lock(true);
  const ns = GRUPOS[g], nResp = Math.max(0, ns.length - 3);
  const ord = shuffle(ns), pres = ord.slice(0,3), resp = ord.slice(3);
  const rows = [
    ...[0,1,2].map(i=>({ el:document.getElementById('pr-'+i), st:pres[i] })),
    ...Array.from({length:nResp},(_,i)=>({ el:document.getElementById('rr-'+i), st:resp[i] })),
  ].filter(r=>r.el && r.st);
  rows.forEach(r=>r.el.classList.add('spin'));
  const sp = setInterval(()=>rows.forEach(r=>{ if (r.el.classList.contains('spin')) r.el.querySelector('.role-name').textContent = shortUp(rnd(ns)); }), 70);
  await sleep(1500); clearInterval(sp);
  for (let i=0;i<rows.length;i++){
    await sleep(300);
    rows[i].el.classList.remove('spin'); rows[i].el.classList.add('locked');
    rows[i].el.querySelector('.role-name').textContent = shortUp(rows[i].st);
    flash(); await sleep(150);
  }
  lock(false);
}

cargarNomina();
